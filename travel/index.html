<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#eef1f6" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0b111d" media="(prefers-color-scheme: dark)" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="여행 수첩" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<!-- A:HEAD -->
<title>여행 수첩</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 레이아웃: 폰 폭 한 줄 컬럼(최대 560px) · 여행은 탑승권 카드 · 여행 안에서는 하단 탭 5개 */
:root {
  --bg: #eef1f6;
  --card: #ffffff;
  --ink: #132036;
  --sub: #5f6b84;
  --line: #dbe1ea;
  --accent: #2c56e0;
  --accent-ink: #ffffff;
  --accent-soft: #e2e8fb;
  --stamp: #c93d27;
  --star: #e89a0c;
  --ok: #1d8f59;
  --warn: #c77a00;
  --danger: #cf3535;
  --shade: rgba(19, 32, 54, .45);
  --g1: #cfdbff; --g2: #ffe2a8; --g3: #c9eedc; --g4: #ffd0c7; --g5: #e3d6ff; --g6: #c8ecf6;
  --f-body: "IBM Plex Sans KR", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --f-code: "Bebas Neue", "Arial Narrow", Impact, sans-serif;
  --r: 14px;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b111d; --card: #141c2c; --ink: #e6ebf4; --sub: #93a0b9; --line: #253049;
    --accent: #7f9bff; --accent-ink: #0b111d; --accent-soft: #1c2848; --stamp: #ff6d57;
    --star: #ffbe45; --ok: #41cf8f; --warn: #ffb13b; --danger: #ff6f6f; --shade: rgba(0, 0, 0, .6);
    --g1: #2a3a6e; --g2: #5a4720; --g3: #1f4a3a; --g4: #5a2c28; --g5: #3d3266; --g6: #1d4554;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b111d; --card: #141c2c; --ink: #e6ebf4; --sub: #93a0b9; --line: #253049;
  --accent: #7f9bff; --accent-ink: #0b111d; --accent-soft: #1c2848; --stamp: #ff6d57;
  --star: #ffbe45; --ok: #41cf8f; --warn: #ffb13b; --danger: #ff6f6f; --shade: rgba(0, 0, 0, .6);
  --g1: #2a3a6e; --g2: #5a4720; --g3: #1f4a3a; --g4: #5a2c28; --g5: #3d3266; --g6: #1d4554;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
body.noscroll { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

.shell { max-width: 560px; margin: 0 auto; padding-bottom: 120px; }

/* 헤더 */
.hdr {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  display: flex; align-items: center; gap: 10px; padding-block: 12px;
  box-shadow: 0 0 0 100vmax var(--bg); clip-path: inset(0 -100vmax);
}
.wordmark { font-family: var(--f-code); font-size: 30px; letter-spacing: .04em; line-height: 1; }
.wordmark small { font-family: var(--f-body); font-size: 13px; font-weight: 600; color: var(--sub); letter-spacing: 0; margin-left: 6px; }
.hdr-title { flex: 1; min-width: 0; }
.hdr-title b { display: block; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hdr-title span { display: block; font-size: 12px; color: var(--sub); }
.icon-btn {
  width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--card);
  display: inline-grid; place-items: center; flex: none; font-size: 20px; line-height: 1;
}
.icon-btn svg { width: 20px; height: 20px; }
.spacer { flex: 1; }
.text-btn { border: 0; background: none; color: var(--accent); font-weight: 600; padding: 8px 4px; }

/* 공통 */
.card { background: var(--card); border-radius: var(--r); padding: 16px; border: 1px solid var(--line); }
.stack { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
.stack > * { min-width: 0; }
.sec { margin: 4px 0 0; font-size: 13px; font-weight: 600; color: var(--sub); letter-spacing: .02em; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .02em; color: var(--sub); margin: 0; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.muted { color: var(--sub); }
.hint { font-size: 12px; color: var(--sub); margin: 0; }
.center { text-align: center; }
.btn {
  border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 11px 16px;
  font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px;
}
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--danger); background: transparent; border-color: transparent; }
.btn.block { width: 100%; }
.btn.small { min-height: 36px; padding: 6px 12px; font-size: 13px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; margin-inline: -4px; padding: 2px 4px 6px; scrollbar-width: none; }
.chips.scroll::-webkit-scrollbar { display: none; }
.chip {
  border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 12px;
  font-size: 13px; white-space: nowrap; flex: none;
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip.off { text-decoration: line-through; color: var(--sub); background: transparent; }
.chip .x { margin-left: 4px; color: var(--sub); }
.tag { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); vertical-align: 2px; }

/* 탑승권 카드 */
.pass {
  display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--card);
  border-radius: 16px; padding: 0; position: relative;
}
.pass-top { display: flex; gap: 14px; align-items: center; padding: 16px 16px 14px; }
.pass-code { font-family: var(--f-code); font-size: 46px; line-height: .9; letter-spacing: .03em; color: var(--accent); min-width: 72px; }
.pass-code.kr { font-family: var(--f-body); font-weight: 700; font-size: 22px; letter-spacing: -.02em; }
.pass-info { flex: 1; min-width: 0; }
.pass-city { font-weight: 700; font-size: 17px; }
.pass-meta { font-size: 12.5px; color: var(--sub); }
.pass-status {
  font-family: var(--f-mono); font-size: 11px; font-weight: 600; letter-spacing: .06em; padding: 4px 8px;
  border-radius: 8px; border: 1.5px solid currentColor; white-space: nowrap; flex: none;
}
.s-ongoing { color: var(--accent); }
.s-upcoming { color: var(--warn); }
.s-done { color: var(--sub); }
.perf { position: relative; height: 0; border-top: 1.5px dashed var(--line); margin-inline: 14px; }
.perf::before, .perf::after {
  content: ""; position: absolute; top: -10px; width: 18px; height: 18px; border-radius: 50%;
  background: var(--bg); border: 1px solid var(--line);
}
.perf::before { left: -24px; clip-path: inset(0 0 0 50%); }
.perf::after { right: -24px; clip-path: inset(0 50% 0 0); }
.pass-bot { padding: 12px 16px 16px; display: grid; gap: 8px; }
.pass-figs { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--sub); }
.pass-figs b { color: var(--ink); font-weight: 600; }
.new-pass {
  width: 100%; border: 1.5px dashed var(--line); background: transparent; border-radius: 16px; padding: 18px;
  color: var(--accent); font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px;
}

/* 미터 */
.meter { height: 8px; border-radius: 99px; background: var(--accent-soft); overflow: hidden; }
.meter > i { display: block; height: 100%; border-radius: 99px; background: var(--accent); }
.meter.warn > i { background: var(--warn); }
.meter.over > i { background: var(--danger); }
.meter.ok > i { background: var(--ok); }

/* 빈 상태 */
.empty { text-align: center; padding: 32px 16px; display: grid; gap: 10px; justify-items: center; }
.empty .big { font-family: var(--f-code); font-size: 54px; color: var(--accent); letter-spacing: .05em; line-height: 1; }
.empty p { margin: 0; color: var(--sub); max-width: 32ch; }

/* 요약 */
.hero-num { font-size: 40px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }
.hero-num.neg { color: var(--danger); }
.stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; min-width: 0; }
.stat .l { font-size: 12px; color: var(--sub); }
.stat .v { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; word-break: keep-all; overflow-wrap: anywhere; }
.stat .s { font-size: 11px; color: var(--sub); }
.hbars { display: grid; gap: 10px; }
.hbar { display: grid; grid-template-columns: 76px 1fr; gap: 10px; align-items: center; font-size: 13px; }
.hbar .track { display: flex; align-items: center; gap: 8px; min-width: 0; }
.hbar .fill { height: 14px; border-radius: 0 4px 4px 0; background: var(--accent); min-width: 2px; }
.hbar .val { font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.cols-wrap { overflow-x: auto; }
.cols { position: relative; display: flex; align-items: flex-end; gap: 2px; height: 140px; padding-top: 18px; border-bottom: 1px solid var(--line); min-width: 100%; }
.col { flex: 1 0 22px; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; }
.col i { display: block; width: min(24px, 70%); background: var(--accent); border-radius: 4px 4px 0 0; opacity: .55; min-height: 0; }
.col.today i { opacity: 1; }
.col-labels { display: flex; gap: 2px; font-size: 10.5px; color: var(--sub); min-width: 100%; }
.col-labels span { flex: 1 0 22px; text-align: center; }
.col-labels .today { color: var(--ink); font-weight: 700; }
.refline { position: absolute; left: 0; right: 0; border-top: 1px solid var(--sub); opacity: .6; pointer-events: none; }
.refline span { position: absolute; right: 0; top: -17px; font-size: 10.5px; color: var(--sub); background: var(--card); padding: 0 4px; }
.mini-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.mini { display: grid; gap: 6px; text-align: left; }

/* 리스트 */
.list { display: grid; gap: 8px; }
.day-h { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: var(--sub); padding: 6px 2px 0; }
.day-h b { color: var(--ink); }
.item {
  display: flex; gap: 12px; align-items: center; width: 100%; text-align: left;
  background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.item-main { flex: 1; min-width: 0; }
.item-title { font-weight: 600; overflow-wrap: anywhere; }
.item-sub { font-size: 12.5px; color: var(--sub); overflow-wrap: anywhere; }
.item-amt { text-align: right; flex: none; }
.item-amt b { display: block; font-variant-numeric: tabular-nums; }
.item-amt span { font-size: 12px; color: var(--sub); font-variant-numeric: tabular-nums; }
.cat-dot {
  width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; flex: none;
  font-size: 13px; font-weight: 700; color: var(--ink);
}
.check {
  width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); background: transparent; flex: none;
  display: grid; place-items: center; padding: 0;
}
.check svg { width: 16px; height: 16px; opacity: 0; }
.check.on { background: var(--ok); border-color: var(--ok); color: #fff; }
.check.on svg { opacity: 1; }
.item.done .item-title { color: var(--sub); }
.stamp {
  font-family: var(--f-mono); font-size: 10px; font-weight: 600; letter-spacing: .08em; color: var(--stamp);
  border: 1.5px solid var(--stamp); border-radius: 6px; padding: 2px 6px; transform: rotate(-6deg); flex: none; text-align: center; line-height: 1.25;
}
.stars { display: inline-flex; gap: 0; }
.star { border: 0; background: none; padding: 3px; color: var(--line); display: grid; }
.star svg { width: 20px; height: 20px; }
.star.on { color: var(--star); }
.stars.lg .star svg { width: 32px; height: 32px; }
.stars.ro .star { padding: 0 1px; cursor: default; }
.stars.ro .star svg { width: 14px; height: 14px; }
.rank { font-family: var(--f-code); font-size: 26px; color: var(--accent); width: 28px; text-align: center; flex: none; line-height: 1; }
.seg { display: flex; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { flex: 1; border: 0; background: transparent; border-radius: 9px; padding: 8px 10px; font-size: 13.5px; font-weight: 600; color: var(--sub); min-height: 38px; }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.seg.wrap { flex-wrap: wrap; }
.seg.wrap button { flex: 1 0 calc(25% - 3px); }

/* 하단 탭 · FAB */
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--card); border-top: 1px solid var(--line);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
}
.nav-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.nav button { border: 0; background: none; display: grid; justify-items: center; gap: 2px; padding: 6px 0; font-size: 11px; font-weight: 600; color: var(--sub); }
.nav button svg { width: 22px; height: 22px; }
.nav button[aria-current="page"] { color: var(--accent); }
.fab {
  position: fixed; z-index: 7; right: max(16px, calc(env(safe-area-inset-right, 0px) + 16px));
  bottom: calc(76px + env(safe-area-inset-bottom, 0px));
  border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-weight: 700;
  padding: 14px 20px; box-shadow: 0 6px 20px rgba(20, 40, 120, .3); display: flex; gap: 6px; align-items: center;
}
@media (min-width: 600px) { .fab { right: calc(50% - 264px); } }

/* 시트 */
.sheet-bg { position: fixed; inset: 0; background: var(--shade); z-index: 20; animation: fade .18s ease; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--card); border-radius: 20px 20px 0 0;
  max-height: 92vh; max-height: 92dvh; overflow-y: auto; animation: up .22s ease;
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.sheet-in { max-width: 560px; margin: 0 auto; }
.sheet-h { position: sticky; top: 0; background: var(--card); display: flex; align-items: center; gap: 8px; padding-block: 16px 10px; z-index: 1; }
.sheet-h h2 { font-size: 18px; flex: 1; }
@keyframes up { from { transform: translateY(30px); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }
.form { display: grid; gap: 14px; }
.field { display: grid; gap: 6px; min-width: 0; }
.lbl { font-size: 12.5px; font-weight: 600; color: var(--sub); }
.form input:not([type="checkbox"]), .form select, .form textarea {
  width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 11px 12px; min-height: 46px; font-size: 16px;
}
.form textarea { min-height: 90px; resize: vertical; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.amount-in { font-size: 28px !important; font-weight: 700; font-family: var(--f-mono); }
.conv { font-size: 13px; color: var(--sub); font-variant-numeric: tabular-nums; min-height: 1.5em; }
.actions { display: flex; gap: 8px; justify-content: space-between; padding-top: 6px; }
.actions .btn.primary { flex: 1; }

/* 게임 */
.game-stage { display: grid; gap: 14px; justify-items: center; }
.wheel-wrap { position: relative; width: min(100%, 330px); }
.wheel-wrap canvas { width: 100%; aspect-ratio: 1; display: block; max-width: 100%; }
.pointer {
  position: absolute; left: 50%; top: -6px; transform: translateX(-50%); width: 0; height: 0;
  border-left: 13px solid transparent; border-right: 13px solid transparent; border-top: 24px solid var(--stamp);
  filter: drop-shadow(0 2px 2px rgba(0,0,0,.2));
}
.hub {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 64px; height: 64px; border-radius: 50%;
  background: var(--ink); color: var(--bg); border: 4px solid var(--card); font-family: var(--f-code); font-size: 22px; letter-spacing: .05em;
}
.ladder { width: 100%; display: grid; gap: 4px; }
.lad-row { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 2px; }
.lad-btn { justify-self: center; width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--accent); background: var(--card); color: var(--accent); font-family: var(--f-code); font-size: 20px; }
.lad-btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.ladder canvas { width: 100%; height: 240px; display: block; }
.lad-res {
  font-size: 12px; text-align: center; font-weight: 600; padding: 6px 2px; border-radius: 8px; background: var(--bg);
  overflow-wrap: anywhere; word-break: keep-all; min-height: 44px; display: grid; place-items: center; line-height: 1.25;
}
.lad-res.hide { font-family: var(--f-code); font-size: 20px; color: var(--sub); }
.lad-res.hit { background: var(--accent); color: var(--accent-ink); }
.cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; }
.pcard { aspect-ratio: 3 / 4; border: 0; background: none; padding: 0; perspective: 600px; position: relative; max-width: 100%; }
.pcard .in { position: absolute; inset: 0; transition: transform .6s ease; transform-style: preserve-3d; }
.pcard.flip .in { transform: rotateY(180deg); }
.pcard .face {
  position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 12px;
  display: grid; place-items: center; padding: 8px; text-align: center;
}
.pcard .back {
  background: var(--accent); color: var(--accent-ink); font-family: var(--f-code); font-size: 34px;
  background-image: repeating-linear-gradient(45deg, transparent 0 8px, rgba(255,255,255,.08) 8px 16px);
}
.pcard .front { background: var(--card); border: 2px solid var(--line); transform: rotateY(180deg); font-weight: 700; font-size: 14px; overflow-wrap: anywhere; word-break: keep-all; }
.pcard.chosen .front { border-color: var(--stamp); color: var(--stamp); }
.pcard.dim { opacity: .55; }
.cards.shuffle .pcard { animation: jig .5s ease; }
.cards.shuffle .pcard:nth-child(2n) { animation-delay: .05s; }
.cards.shuffle .pcard:nth-child(3n) { animation-delay: .1s; }
@keyframes jig { 25% { transform: translate(6px, -8px) rotate(4deg); } 60% { transform: translate(-6px, 4px) rotate(-4deg); } }
.result {
  border: 2px solid var(--stamp); border-radius: 16px; padding: 18px 16px; text-align: center; display: grid; gap: 10px;
  background: var(--card); animation: pop .35s ease;
}
.result .eyebrow { color: var(--stamp); }
.result h3 { font-size: 24px; overflow-wrap: anywhere; }
@keyframes pop { from { transform: scale(.92); opacity: 0; } }
.addrow { display: flex; gap: 8px; }
.addrow input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 10px 12px; font-size: 16px; }

.toast {
  position: fixed; left: 50%; bottom: calc(140px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 30;

const cur = () => S.trips[S.tripId];
function normTrip(t) {
  t.kind = 'trip';
  t.expenses = Array.isArray(t.expenses) ? t.expenses : [];
  t.places = Array.isArray(t.places) ? t.places : [];
  t.foods = Array.isArray(t.foods) ? t.foods : [];
  t.courses = Array.isArray(t.courses) ? t.courses : [];
  return t;
}

/* ---------- 저장소: claude 계정(가능하면) → 아니면 이 기기 ---------- */
function readLocal() {
  try { const o = JSON.parse(localStorage.getItem(KEY) || '{}'); return o && typeof o === 'object' ? o : {}; } catch (e) { return {}; }
}
function writeLocal() { try { localStorage.setItem(KEY, JSON.stringify(S.trips)); } catch (e) {} }
function clearLocal() { try { localStorage.removeItem(KEY); } catch (e) {} }

const Store = {
  mode: 'pending', col: null, timers: new Map(), writing: new Set(), again: new Set(), first: true,
  async init() {
    const local = readLocal();
    Object.values(local).forEach(t => { if (t && t.id) S.trips[t.id] = normTrip(t); });
    const c = window.claude;
    if (!c || typeof c.use !== 'function') { this.mode = 'local'; render(); refreshActiveRates(); return; }
    render();
    try {
      const [db, user] = await Promise.all([c.use('db'), c.use('user')]);
      const id = user ? await user.id() : null;
      if (!db || !id) { this.mode = 'local'; render(); refreshActiveRates(); return; }
      this.col = db.collection('data/users/' + id);
      this.mode = 'cloud';
      this.col.onSnapshot(snap => this.onSnap(snap), () => {
        this.mode = 'local'; writeLocal(); toast('연결이 끊겨 이 기기에 임시 저장해요'); render();
      });
    } catch (e) { this.mode = 'local'; render(); refreshActiveRates(); }
  },
  onSnap(snap) {
    const seen = new Set();
    const next = {};
    snap.docs.forEach(d => {
      const v = d.data();
      if (!v || v.kind !== 'trip') return;
      seen.add(d.id);
      next[d.id] = normTrip(JSON.parse(JSON.stringify(v)));
    });
    const busy = id => this.timers.has(id) || this.writing.has(id);
    if (this.first) {
      this.first = false;
      // 이 기기에만 있던 여행은 계정으로 옮겨요
      const local = readLocal();
      Object.values(S.trips).concat(Object.values(local)).forEach(t => {
        if (t && t.id && !seen.has(t.id)) { next[t.id] = normTrip(t); this.save(t.id, next); }
      });
      clearLocal();
      S.trips = next;
      setTimeout(refreshActiveRates, 0);
    } else {
      Object.keys(next).forEach(id => {
        if (busy(id)) return;
        const old = S.trips[id];
        if (old && JSON.stringify(old) === JSON.stringify(next[id])) return;
        S.trips[id] = next[id];
      });
      Object.keys(S.trips).forEach(id => { if (!seen.has(id) && !busy(id)) delete S.trips[id]; });
    }
    render();
  },
  save(id) {
    const t = S.trips[id];
    if (t) t.updatedAt = Date.now();
    if (this.mode !== 'cloud') { writeLocal(); return; }
    clearTimeout(this.timers.get(id));
    this.timers.set(id, setTimeout(() => { this.timers.delete(id); this.flush(id); }, 350));
  },
  remove(id) { delete S.trips[id]; this.save(id); },
  async flush(id, retried) {
    if (this.writing.has(id)) { this.again.add(id); return; }
    this.writing.add(id);
    try {
      const t = S.trips[id];
      if (t) await this.col.doc(id).set(JSON.parse(JSON.stringify(t)));
      else await this.col.doc(id).delete();
    } catch (e) {
      const code = e && e.code;
      if (code === 'unavailable' && !retried) setTimeout(() => this.flush(id, true), 800 + Math.random() * 800);
      else toast(code === 'quota_exceeded' ? '저장 공간이 가득 찼어요. 지난 여행을 정리해 주세요' : '저장하지 못했어요. 잠시 후 다시 해 주세요');
    } finally {
      this.writing.delete(id);
      if (this.again.has(id)) { this.again.delete(id); this.flush(id); }
    }
  },
  flushAll() { this.timers.forEach((tm, id) => { clearTimeout(tm); this.timers.delete(id); this.flush(id); }); }
};
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') Store.flushAll();
  else if (S.view === 'trip') refreshRate(cur());
});
setInterval(() => { if (document.visibilityState === 'visible' && S.view === 'trip') refreshRate(cur()); }, 10 * 60e3);
// 시트가 열린 동안 동기화로 객체가 바뀌어도 수정 내용이 사라지지 않게 다시 붙여요
function commit(t) { S.trips[t.id] = t; Store.save(t.id); render(); }

/* ---------- 사진 ---------- */
// Claude 페이지에서는 artifact 파일 저장소에, 그 밖(내 사이트)에서는 이 기기 브라우저(IndexedDB)에 저장해요
function openIDB() {
  return new Promise((res, rej) => {
    if (!window.indexedDB) return rej(new Error('no idb'));
    const r = indexedDB.open('travel-photos', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('p');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
function idbReq(db, mode, fn) {
  return new Promise((res, rej) => {
    const tx = db.transaction('p', mode); const q = fn(tx.objectStore('p'));
    tx.oncomplete = () => res(q && q.result); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
  });
}
const Photos = {
  mode: 'pending', api: null, idb: null, urls: {}, ready: null,
  init() {
    this.ready = (async () => {
      const c = window.claude;
      if (c && typeof c.use === 'function') {
        try { const a = await c.use('assets'); if (a) { this.api = a; this.mode = 'cloud'; return; } } catch (e) {}
      }
      try { this.idb = await openIDB(); this.mode = 'local'; } catch (e) { this.mode = 'none'; }
    })();
    return this.ready;
  },
  src(ph) {
    if (ph.a) return window.claude ? '/_blob/' + ph.a : '';
    return (ph.l && this.urls[ph.l]) || '';
  },
  async localURL(id) {
    if (this.urls[id]) return this.urls[id];
    await this.ready;
    if (!this.idb) return '';
    try {
      const blob = await idbReq(this.idb, 'readonly', st => st.get(id));
      if (!blob) return '';
      return (this.urls[id] = URL.createObjectURL(blob));
    } catch (e) { return ''; }
  },
  async add(blob) {
    await this.ready;
    if (this.mode === 'cloud') {
      let r;
      try { r = await this.api.upload(blob, { type: 'image/jpeg' }); }
      catch (e) {
        if (e && e.code === 'store_unavailable') { await new Promise(z => setTimeout(z, 1200)); r = await this.api.upload(blob, { type: 'image/jpeg' }); }
        else throw e;
      }
      return { a: r.id, ts: Date.now() };
    }
    if (this.mode === 'local') {
      const id = uid();
      await idbReq(this.idb, 'readwrite', st => st.put(blob, id));
      this.urls[id] = URL.createObjectURL(blob);
      return { l: id, ts: Date.now() };
    }
    throw { code: 'no_store' };
  },
  remove(ph) {
    if (!ph) return;
    if (ph.a && this.api) this.api.delete(ph.a).catch(() => {});
    if (ph.l) {
      if (this.urls[ph.l]) { URL.revokeObjectURL(this.urls[ph.l]); delete this.urls[ph.l]; }
      if (this.idb) idbReq(this.idb, 'readwrite', st => st.delete(ph.l)).catch(() => {});
    }
  },
  removeAll(items) { (items || []).forEach(it => (it.photos || []).forEach(ph => this.remove(ph))); }
};
Photos.init();
async function compressImage(file) {
  const MAX = 1600;
  let src, w, h, done = () => {};
  try {
    src = await createImageBitmap(file, { imageOrientation: 'from-image' });
    w = src.width; h = src.height; done = () => { if (src.close) src.close(); };
  } catch (e) {
    src = await new Promise((res, rej) => {
      const u = URL.createObjectURL(file); const im = new Image();
      im.onload = () => { URL.revokeObjectURL(u); res(im); };
      im.onerror = () => { URL.revokeObjectURL(u); rej({ code: 'decode' }); };
      im.src = u;
    });
    w = src.naturalWidth; h = src.naturalHeight;
  }
  const k = Math.min(1, MAX / Math.max(w, h));
  const cv = document.createElement('canvas');
  cv.width = Math.max(1, Math.round(w * k)); cv.height = Math.max(1, Math.round(h * k));
  cv.getContext('2d').drawImage(src, 0, 0, cv.width, cv.height);
  done();
  return new Promise((res, rej) => cv.toBlob(b => b ? res(b) : rej({ code: 'decode' }), 'image/jpeg', 0.82));
}
function photoErr(e) {
  const c = e && e.code;
  if (c === 'decode') return '이 사진은 열 수 없어요. JPG나 PNG 사진으로 올려 주세요.';
  if (c === 'too_large') return '사진이 너무 커요.';
  if (c === 'quota_or_state') return '사진 저장 공간이 가득 찼어요. 안 쓰는 사진을 지워 주세요.';
  if (c === 'rate_limited') return '잠깐 뒤에 다시 올려 주세요.';
  if (c === 'no_store') return '이 브라우저에서는 사진을 저장할 수 없어요.';
  if (e && e.name === 'QuotaExceededError') return '기기 저장 공간이 부족해요.';
  return '사진을 올리지 못했어요. 다시 시도해 주세요.';
}
function imgTag(ph, alt) {
  const src = Photos.src(ph);
  return '<img alt="' + esc(alt || '') + '" loading="lazy" decoding="async"' + (src ? ' src="' + esc(src) + '"' : '') + (ph.l && !src ? ' data-ph-l="' + esc(ph.l) + '"' : '') + '>';
}
function hydratePhotos() {
  $$('img[data-ph-l]').forEach(img => {
    if (img.getAttribute('src')) return;
    Photos.localURL(img.dataset.phL).then(u => { if (u) img.src = u; });
  });
}
const itemOf = (t, kind, id) => t && (kind === 'place' ? t.places : t.foods).find(x => x.id === id);
function camLabel(kind, id, cls, inner, aria) {
  return '<label for="photoInput" class="' + cls + '" data-act="photo-target" data-kind="' + kind + '" data-id="' + id + '" aria-label="' + esc(aria || '사진 추가') + '" role="button" tabindex="0">' + inner + '</label>';
}
// 목록 한 줄의 사진 자리: 사진이 있으면 첫 장 썸네일, 다녀온 곳이면 카메라 버튼
function photoSlot(kind, it, visited) {
  const ph = it.photos || [];
  if (ph.length) return '<button class="thumb" data-act="photo-view" data-kind="' + kind + '" data-id="' + it.id + '" aria-label="' + esc(it.name) + ' 사진 ' + ph.length + '장 보기">' + imgTag(ph[ph.length - 1], '') + (ph.length > 1 ? '<span class="cnt">' + ph.length + '</span>' : '') + '</button>';
  if (visited) return camLabel(kind, it.id, 'map-btn cam', ICON.cam, esc(it.name) + ' 사진 추가');

}
function photoGridInner(kind, it) {
  const ph = it.photos || [];
  return ph.map((x, i) => '<button type="button" class="thumb" data-act="photo-view" data-kind="' + kind + '" data-id="' + it.id + '" data-i="' + i + '" aria-label="사진 ' + (i + 1) + ' 보기">' + imgTag(x, '') + '</button>').join('') +
    camLabel(kind, it.id, 'ph-add', ICON.cam + '<span>사진 추가</span>');
}
function refreshPhotoGrids() {
  const t = cur();
  $$('.ph-grid').forEach(g => { const it = itemOf(t, g.dataset.kind, g.dataset.id); if (it) g.innerHTML = photoGridInner(g.dataset.kind, it); });
  hydratePhotos();
}
function allPhotos(t, scope) {
  const out = [];
  const push = (kind, it) => (it.photos || []).forEach(ph => out.push({ ph, label: it.name, kind, id: it.id }));
  if (scope && scope.kind) { const it = itemOf(t, scope.kind, scope.id); if (it) push(scope.kind, it); return out; }
  t.places.forEach(p => push('place', p)); t.foods.forEach(f => push('food', f));
  return out.sort((a, b) => (b.ph.ts || 0) - (a.ph.ts || 0));
}
async function onPhotoFiles(files) {
  const tg = S.photoTarget;
  if (!files.length || !tg) return;
  toast(files.length > 1 ? '사진 ' + files.length + '장 올리는 중…' : '사진 올리는 중…');
  let ok = 0;
  for (const file of files) {
    try {
      const blob = await compressImage(file);
      const ph = await Photos.add(blob);
      const t = S.trips[tg.trip];
      const it = itemOf(t, tg.kind, tg.id);
      if (!it) { Photos.remove(ph); continue; }
      (it.photos = it.photos || []).push(ph);
      ok++;
      commit(t); refreshPhotoGrids(); if (S.viewer) renderViewer();
    } catch (e) { toast(photoErr(e)); return; }
  }
  if (ok) toast('사진 ' + ok + '장을 추가했어요');
}

  const v = S.viewer; if (!v) return;

    '<div class="v-img">' + imgTag(it.ph, it.label + ' 사진') + '</div>' +

    '<div class="v-bot">' + (v.confirm
      ? '<span>이 사진을 지울까요?</span><span class="row"><button class="btn small" data-act="viewer-nodel">취소</button><button class="btn small warn" data-act="viewer-del-ok">삭제</button></span>'
      : camLabel(it.kind, it.id, 'btn small', '사진 추가') + '<button class="btn small" data-act="viewer-del">삭제</button>') + '</div></div>';

}
(function () {
  let x0 = null;
  document.addEventListener('touchstart', e => { if (S.viewer && e.target.closest('.viewer')) x0 = e.touches[0].clientX; }, { passive: true });
  document.addEventListener('touchend', e => {
    if (x0 == null || !S.viewer) return;
    const dx = e.changedTouches[0].clientX - x0; x0 = null;
    if (Math.abs(dx) > 50) { S.viewer.i += dx < 0 ? 1 : -1; S.viewer.confirm = false; renderViewer(); }
  }, { passive: true });
})();

/* ---------- 계산 ---------- */
function stats(t) {
  const spent = t.expenses.reduce((s, e) => s + expKRW(t, e), 0);
  const spentLocal = t.expenses.filter(e => e.cur === t.cur).reduce((s, e) => s + e.amt, 0);
  const budget = t.budget ? toKRW(t, Number(t.budget), t.budgetCur || 'KRW') : 0;
  const days = Math.max(1, diffDays(t.start, t.end) + 1);
  const today = todayISO();
  let status = 'ongoing', dayIdx = 0;
  if (today < t.start) status = 'upcoming';
  else if (today > t.end) status = 'done';
  else dayIdx = diffDays(t.start, today) + 1;
  const remainDays = status === 'upcoming' ? days : status === 'ongoing' ? days - dayIdx + 1 : 0;
  const todaySpent = t.expenses.filter(e => e.date === today).reduce((s, e) => s + expKRW(t, e), 0);
  const spentBeforeToday = t.expenses.filter(e => e.date < today).reduce((s, e) => s + expKRW(t, e), 0);
  const left = budget - spent;
  // 오늘 포함 남은 날로 나눈 하루 사용 가능 금액 (오늘 쓴 돈은 오늘 몫에서 빠짐)
  const perDay = remainDays > 0 ? (budget - spentBeforeToday) / remainDays : 0;
  const placesDone = t.places.filter(p => p.done).length;
  const rated = t.foods.filter(f => f.visited && f.rating > 0);
  const avgRating = rated.length ? rated.reduce((s, f) => s + f.rating, 0) / rated.length : 0;
  return { spent, spentLocal, budget, left, days, status, dayIdx, remainDays, todaySpent, perDay, placesDone, rated, avgRating, today };
}
function meterCls(p) { return p >= 1 ? 'over' : p >= .8 ? 'warn' : ''; }

/* ---------- 렌더 ---------- */
function render() {
  if (S.game.busy) { S.renderPending = true; return; }
  S.renderPending = false;
  let t = cur();
  if (S.view === 'trip' && !t) { S.view = 'home'; t = null; }
  $('#hdr').innerHTML = S.view === 'home' ? homeHeader() : tripHeader(t);
  $('#main').innerHTML = S.view === 'home' ? homeView() : tripView(t);
  const nav = $('#nav');
  nav.hidden = S.view !== 'trip';
  if (S.view === 'trip') {
    nav.innerHTML = '<div class="nav-in">' + TABS.map(([k, n]) =>
      '<button data-act="tab" data-tab="' + k + '"' + (S.tab === k ? ' aria-current="page"' : '') + '>' + ICON[k] + '<span>' + n + '</span></button>').join('') + '</div>';
  }
  const fab = $('#fab');
  const fabLabel = { exp: '지출 추가', place: '가볼 곳 추가', food: '맛집 추가' }[S.tab];
  fab.hidden = !(S.view === 'trip' && fabLabel);
  if (fabLabel) fab.innerHTML = '<span aria-hidden="true">+</span> ' + fabLabel;
  if (S.view === 'trip' && S.tab === 'game') mountGame(t);
  hydratePhotos();
}

function sortedTrips() {
  const order = { ongoing: 0, upcoming: 1, done: 2 };
  return Object.values(S.trips).map(t => ({ t, st: stats(t) })).sort((a, b) => {
    if (order[a.st.status] !== order[b.st.status]) return order[a.st.status] - order[b.st.status];
    return a.st.status === 'done' ? (a.t.start < b.t.start ? 1 : -1) : (a.t.start < b.t.start ? -1 : 1);
  });
}

function homeView() {

  let h = '';

    if (Store.mode === 'pending') return '<p class="muted center" style="padding:40px 0">여행 기록을 불러오는 중…</p>';
    h += '<section class="card empty"><div class="big">ICN → ?</div><h2>첫 여행을 기록해 보세요</h2>' +

      '<button class="btn primary" data-act="new-trip">새 여행 만들기</button>' +
      '<button class="btn ghost" data-act="sample">예시 여행으로 둘러보기</button></section>';
  } else {
    h += '<button class="new-pass" data-act="new-trip"><span aria-hidden="true">+</span> 새 여행</button>';
    let lastGroup = '';
    const gname = { ongoing: '여행 중', upcoming: '다가오는 여행', done: '지난 여행' };
    list.forEach(({ t, st }) => {
      if (st.status !== lastGroup) { lastGroup = st.status; h += '<p class="sec">' + gname[st.status] + '</p>'; }
      h += passCard(t, st);
    });
  }
  h += '<div class="foot">' + (canInstall() ? '<div class="row" style="justify-content:center"><button class="btn small" data-act="install">홈 화면에 앱 추가</button><button class="btn small" data-act="share-app">친구에게 앱 공유</button></div>' : '') +
    (window.claude ? '<p class="hint">실시간 환율과 홈 화면 설치는 사이트 버전에서 돼요. <a href="' + SITE_URL + '" target="_blank" rel="noopener">사이트에서 열기</a></p>' : '') +
    '<p class="hint">' + storageNote() + '</p></div>';
  return h;
}
function storageNote() {
  if (Store.mode === 'cloud') return 'Claude 계정에 저장돼요. 다른 기기에서 열어도 그대로 보여요.';
  if (Store.mode === 'pending') return '저장소 연결 중…';
  return '이 기기 브라우저에 저장돼요. 메뉴의 백업으로 옮길 수 있어요.';
}

function tripView(t) {
  if (S.tab === 'exp') return expView(t);
  if (S.tab === 'place') return placeView(t);
  if (S.tab === 'food') return foodView(t);
  if (S.tab === 'game') return gameView(t);
  return sumView(t);
}

/* 요약 */
function sumView(t) {
  const st = stats(t);
  const p = st.budget ? st.spent / st.budget : 0;
  let h = '<section class="card stack">';
  if (st.budget) {
    h += '<p class="eyebrow">남은 예산 · ' + (st.status === 'upcoming' ? '출발 D-' + diffDays(st.today, t.start) : st.status === 'ongoing' ? 'DAY ' + st.dayIdx + ' / ' + st.days : '여행 끝') + '</p>' +
      '<div class="hero-num' + (st.left < 0 ? ' neg' : '') + '">' + (st.left < 0 ? '-' : '') + won(Math.abs(st.left)) + '</div>' +
      '<div class="meter ' + meterCls(p) + '"><i style="width:' + Math.min(100, p * 100).toFixed(1) + '%"></i></div>' +
      '<div class="pass-figs"><span>예산 <b>' + won(st.budget) + '</b></span><span>사용 <b>' + won(st.spent) + '</b> (' + Math.round(p * 100) + '%)</span></div>';
    if (st.left < 0) h += '<p class="hint" style="color:var(--danger)">예산을 ' + won(-st.left) + ' 넘었어요.</p>';
  } else {
    h += '<p class="eyebrow">총 지출</p><div class="hero-num">' + won(st.spent) + '</div>' +
      '<p class="hint">예산을 정하면 남은 금액과 하루 사용 가능 금액을 보여 드려요.</p>' +
      '<button class="btn small" data-act="edit-trip">예산 정하기</button>';
  }
  h += '</section>';

  h += rateCard(t);
  const localTxt = t.cur !== 'KRW' ? money(st.spentLocal, t.cur) : won(st.spent);
  h += '<div class="stat-row">' +
    '<div class="stat"><div class="l">하루 사용 가능</div><div class="v">' + (st.budget && st.remainDays ? (st.perDay < 0 ? '0원' : shortWon(st.perDay) + '원') : '–') + '</div><div class="s">' + (st.remainDays ? '남은 ' + st.remainDays + '일 기준' : '여행 끝') + '</div></div>' +
    '<div class="stat"><div class="l">오늘 쓴 돈</div><div class="v">' + shortWon(st.todaySpent) + '원</div><div class="s">' + (st.budget && st.remainDays && st.status !== 'upcoming' ? (st.perDay - st.todaySpent >= 0 ? shortWon(st.perDay - st.todaySpent) + '원 남음' : shortWon(st.todaySpent - st.perDay) + '원 초과') : fmtMD(st.today)) + '</div></div>' +
    '<div class="stat"><div class="l">' + (t.cur !== 'KRW' ? '현지 통화 지출' : '지출 건수') + '</div><div class="v">' + (t.cur !== 'KRW' ? esc(localTxt) : t.expenses.length + '건') + '</div><div class="s">' + (t.cur !== 'KRW' ? esc(rateText(t)) : '') + '</div></div>' +
  '</div>';

  // 카테고리별
  const byCat = CATS.map(c => ({ c, v: t.expenses.filter(e => e.cat === c.k).reduce((s, e) => s + expKRW(t, e), 0) })).filter(x => x.v > 0).sort((a, b) => b.v - a.v);
  h += '<section class="card stack"><h3 class="sec">어디에 썼나</h3>';
  if (!byCat.length) h += '<p class="hint">아직 지출이 없어요. 아래 지출 탭에서 첫 지출을 적어 보세요.</p>';
  else {
    const max = byCat[0].v;
    h += '<div class="hbars">' + byCat.map(x =>
      '<div class="hbar" title="' + esc(x.c.n) + ' ' + won(x.v) + '"><span>' + x.c.n + '</span><div class="track"><div class="fill" style="width:calc((100% - 96px) * ' + (x.v / max).toFixed(3) + ')"></div><span class="val">' + shortWon(x.v) + '원 · ' + Math.round(x.v / st.spent * 100) + '%</span></div></div>').join('') + '</div>';
  }
  h += '</section>';

  // 일별
  const days = [];
  for (let i = 0; i < st.days && i < 60; i++) days.push(addDays(t.start, i));
  const dayVals = days.map(d => t.expenses.filter(e => e.date === d).reduce((s, e) => s + expKRW(t, e), 0));
  const outside = t.expenses.filter(e => e.date < t.start || e.date > t.end).reduce((s, e) => s + expKRW(t, e), 0);
  const avgBudget = st.budget ? (st.budget - outside) / st.days : 0;
  const maxV = Math.max(1, ...dayVals, avgBudget);
  h += '<section class="card stack"><h3 class="sec">날짜별 지출</h3><div class="cols-wrap"><div class="cols" style="min-width:' + (days.length * 24) + 'px">' +
    (avgBudget > 0 ? '<div class="refline" style="bottom:' + (avgBudget / maxV * 122).toFixed(1) + 'px"><span>하루 예산 ' + shortWon(avgBudget) + '</span></div>' : '') +
    days.map((d, i) => '<div class="col' + (d === st.today ? ' today' : '') + '" title="' + fmtMDW(d) + ' ' + won(dayVals[i]) + '"><i style="height:' + (dayVals[i] / maxV * 122).toFixed(1) + 'px"></i></div>').join('') +
    '</div><div class="col-labels" style="min-width:' + (days.length * 24) + 'px">' + days.map(d => '<span' + (d === st.today ? ' class="today"' : '') + '>' + parseD(d).getDate() + '</span>').join('') + '</div></div>' +
    (outside ? '<p class="hint">여행 기간 밖 지출(항공권·숙소 예약 등) ' + won(outside) + '은 날짜별 그래프에서 빠져 있어요.</p>' : '') + '</section>';

  // 방문지·맛집
  const pp = t.places.length ? st.placesDone / t.places.length : 0;
  const best = st.rated.slice().sort((a, b) => b.rating - a.rating)[0];
  const photos = allPhotos(t);
  if (photos.length) {
    h += '<section class="card stack"><h3 class="sec">여행 사진 ' + photos.length + '장</h3><div class="strip">' + photos.slice(0, 30).map((x, i) =>
      '<button class="thumb" data-act="photo-all" data-i="' + i + '" aria-label="' + esc(x.label) + ' 사진">' + imgTag(x.ph, '') + '</button>').join('') + '</div></section>';
  }
  if (t.courses.length) h += savedCourseCard(t);
  h += '<div class="mini-grid">' +
    '<button class="card mini" data-act="tab" data-tab="place"><span class="sec">방문지</span><b class="hero-num" style="font-size:26px">' + st.placesDone + '<span class="muted" style="font-size:16px"> / ' + t.places.length + '곳</span></b><div class="meter ok"><i style="width:' + (pp * 100).toFixed(1) + '%"></i></div></button>' +
    '<button class="card mini" data-act="tab" data-tab="food"><span class="sec">맛집 평균</span><b class="hero-num" style="font-size:26px">' + (st.avgRating ? st.avgRating.toFixed(1) : '–') + '<span class="muted" style="font-size:16px"> / 5</span></b>' +
      '<span class="item-sub">' + (best ? '최고: ' + esc(best.name) : '아직 평가한 곳이 없어요') + '</span></button>' +
  '</div>';
  return h;
}

function rateCard(t) {
  if (t.cur === 'KRW') return '';
  const live = t.rateMode !== 'manual';
  const stt = S.rateState[t.id];
  let sub, extra = '';
  if (!live) { sub = '직접 입력한 환율로 계산해요'; extra = naverRate(t.cur); }
  else if (stt === 'loading' && !t.rateAt) sub = '실시간 환율 확인 중…';
  else if (stt === 'fail') { sub = '실시간 환율에 연결하지 못해 ' + (t.rateAt ? t.rateAt + ' 환율' : '저장된 환율') + '로 계산 중'; extra = naverRate(t.cur) + (window.claude ? ' · <a href="' + SITE_URL + '" target="_blank" rel="noopener">사이트 버전 열기</a>' : ''); }
  else sub = '실시간 · ' + [t.rateSrc, t.rateAt].filter(Boolean).join(' ');
  return '<section class="card rate-card"><div class="rate-main"><span class="l">환율</span><b>' + esc(rateText(t)) + '</b><span class="hint">' + esc(sub) + (extra ? ' · ' + extra : '') + '</span></div>' +
    (live ? '<button class="icon-btn" data-act="rate-refresh" aria-label="환율 새로고침"' + (stt === 'loading' ? ' disabled' : '') + '>↻</button>' : '<button class="btn small" data-act="edit-trip">바꾸기</button>') + '</section>';
}

/* 지출 */
function expView(t) {
  const st = stats(t);
  let list = t.expenses.slice();
  if (S.expFilter !== 'all') list = list.filter(e => e.cat === S.expFilter);
  const sum = list.reduce((s, e) => s + expKRW(t, e), 0);
  let h = '<section class="card"><p class="eyebrow">' + (S.expFilter === 'all' ? '총 지출' : CAT[S.expFilter].n) + '</p><div class="hero-num" style="font-size:32px">' + won(sum) + '</div>' +
    (st.budget ? '<p class="hint">예산 ' + won(st.budget) + ' 중 ' + Math.round(st.spent / st.budget * 100) + '% 사용</p>' : '') + '</section>';
  h += '<div class="chips scroll">' + [['all', '전체']].concat(CATS.map(c => [c.k, c.n])).map(([k, n]) =>
    '<button class="chip" data-act="exp-filter" data-v="' + k + '" aria-pressed="' + (S.expFilter === k) + '">' + n + '</button>').join('') + '</div>';
  if (!list.length) {
    h += '<div class="card empty"><p>' + (t.expenses.length ? '이 분류의 지출이 없어요.' : '아직 적은 지출이 없어요. 오른쪽 아래 <b>지출 추가</b>로 첫 지출을 적어 보세요.') + '</p></div>';
    return h;
  }
  list.sort((a, b) => b.date.localeCompare(a.date) || (b.ts || 0) - (a.ts || 0));
  const groups = [];
  list.forEach(e => { const g = groups[groups.length - 1]; if (g && g.date === e.date) g.items.push(e); else groups.push({ date: e.date, items: [e] }); });
  h += '<div class="list">';
  groups.forEach(g => {
    const tot = g.items.reduce((s, e) => s + expKRW(t, e), 0);
    const dn = g.date >= t.start && g.date <= t.end ? ' · DAY ' + (diffDays(t.start, g.date) + 1) : g.date < t.start ? ' · 출발 전' : ' · 귀국 후';
    h += '<div class="day-h"><span><b>' + fmtMDW(g.date) + '</b>' + dn + '</span><span class="num">' + won(tot) + '</span></div>';
    g.items.forEach(e => {
      const c = CAT[e.cat] || CAT.etc;
      h += '<button class="item" data-act="exp-edit" data-id="' + e.id + '"><span class="cat-dot" style="background:' + c.g + '">' + c.n[0] + '</span>' +
        '<span class="item-main"><span class="item-title">' + esc(e.memo || c.n) + '</span><span class="item-sub" style="display:block">' + c.n + ' · ' + (e.pay === 'cash' ? '현금' : '카드') + '</span></span>' +
        '<span class="item-amt"><b>' + esc(money(e.amt, e.cur)) + '</b>' + (e.cur !== 'KRW' ? '<span>' + won(expKRW(t, e)) + '</span>' : '') + '</span></button>';
    });
  });
  return h + '</div>';
}

/* 방문지 */
function placeView(t) {
  const done = t.places.filter(p => p.done).length;
  const total = t.places.length;
  let h = '<section class="card stack"><p class="eyebrow">방문 체크</p><div class="hero-num" style="font-size:32px">' + done + '<span class="muted" style="font-size:18px"> / ' + total + '곳</span></div>' +
    '<div class="meter ok"><i style="width:' + (total ? done / total * 100 : 0).toFixed(1) + '%"></i></div></section>';
  h += '<div class="seg" role="group">' + [['todo', '가볼 곳 ' + (total - done)], ['done', '다녀온 곳 ' + done], ['all', '전체']].map(([k, n]) =>
    '<button data-act="place-filter" data-v="' + k + '" aria-pressed="' + (S.placeFilter === k) + '">' + n + '</button>').join('') + '</div>';
  let list = t.places.slice();
  if (S.placeFilter === 'todo') list = list.filter(p => !p.done);
  if (S.placeFilter === 'done') list = list.filter(p => p.done).sort((a, b) => (b.doneAt || '').localeCompare(a.doneAt || ''));
  if (!list.length) {
    h += '<div class="card empty"><p>' + (total ? (S.placeFilter === 'todo' ? '가볼 곳을 모두 다녀왔어요!' : '아직 다녀온 곳이 없어요.') : '가고 싶은 지역이나 명소를 적어 두고, 다녀오면 체크하세요.') + '</p></div>';
    return h;
  }
  h += '<div class="list">' + list.map(p =>
    '<div class="item' + (p.done ? ' done' : '') + '">' +
      '<button class="check' + (p.done ? ' on' : '') + '" data-act="place-toggle" data-id="' + p.id + '" aria-label="' + esc(p.name) + (p.done ? ' 방문 취소' : ' 방문 체크') + '">' + ICON.check + '</button>' +
      '<button class="item-main" style="border:0;background:none;text-align:left;padding:0" data-act="place-edit" data-id="' + p.id + '"><span class="item-title" style="display:block">' + esc(p.name) + '</span>' +
        (p.area || p.memo ? '<span class="item-sub" style="display:block">' + esc([p.area, p.memo].filter(Boolean).join(' · ')) + '</span>' : '') +
        (p.done ? '<span class="stamp" style="display:inline-block;margin-top:6px">VISITED ' + (p.doneAt ? fmtMD(p.doneAt) : '') + '</span>' : '') + '</button>' +
      photoSlot('place', p, p.done) + mapBtn(p, t) +
    '</div>').join('') + '</div>';
  return h;
}

/* 맛집 */
function mapBtn(f, t) {
  return '<a class="map-btn' + (f.map ? ' saved' : '') + '" href="' + esc(mapURL(f, t)) + '" target="_blank" rel="noopener" aria-label="구글맵에서 ' + esc(f.name) + ' ' + (f.map ? '열기' : '찾기') + '" title="' + (f.map ? '저장한 구글맵 링크 열기' : '구글맵에서 찾기') + '">' + ICON.place + '</a>';
}
function foodView(t) {
  const done = t.foods.filter(f => f.visited);
  const wish = t.foods.filter(f => !f.visited);
  let h = '<div class="seg" role="group">' + [['done', '다녀온 맛집 ' + done.length], ['wish', '가고 싶은 곳 ' + wish.length]].map(([k, n]) =>
    '<button data-act="food-tab" data-v="' + k + '" aria-pressed="' + (S.foodTab === k) + '">' + n + '</button>').join('') + '</div>';
  if (S.foodTab === 'done') {
    if (!done.length) return h + '<div class="card empty"><p>다녀온 맛집을 적고 별점을 매겨 보세요. 별점 순으로 순위가 매겨져요.</p></div>';
    const list = done.slice().sort((a, b) => (b.rating || 0) - (a.rating || 0) || (b.date || '').localeCompare(a.date || ''));
    h += '<div class="list">' + list.map((f, i) =>
      '<div class="item"><span class="rank">' + (i + 1) + '</span>' +
        '<div class="food-main"><button class="item-main" style="border:0;background:none;text-align:left;padding:0;width:100%" data-act="food-edit" data-id="' + f.id + '"><span class="item-title" style="display:block">' + esc(f.name) + '</span>' +
        '<span class="item-sub" style="display:block">' + esc([f.menu, f.area, f.price ? money(f.price, f.priceCur || t.cur) : ''].filter(Boolean).join(' · ') || '메뉴를 적어 두면 좋아요') + '</span>' +
        (f.memo ? '<span class="item-sub" style="display:block">“' + esc(f.memo) + '”</span>' : '') + '</button>' +
        starsHTML(f.rating || 0, { id: f.id }) + '</div>' + photoSlot('food', f, true) + mapBtn(f, t) +
      '</div>').join('') + '</div>';
  } else {
    if (!wish.length) return h + '<div class="card empty"><p>찜해 둔 맛집이 없어요. 가고 싶은 곳을 적어 두면 ‘고르기’ 게임 후보로도 쓸 수 있어요.</p></div>';
    h += '<div class="list">' + wish.map(f =>
      '<div class="item"><button class="item-main" style="border:0;background:none;text-align:left;padding:0" data-act="food-edit" data-id="' + f.id + '"><span class="item-title" style="display:block">' + esc(f.name) + '</span>' +
        '<span class="item-sub" style="display:block">' + esc([f.menu, f.area].filter(Boolean).join(' · ') || '가고 싶은 곳') + '</span></button>' +
        mapBtn(f, t) + '<button class="btn small" data-act="food-went" data-id="' + f.id + '">다녀왔어요</button></div>').join('') + '</div>';
  }
  return h;
}

/* ---------- 게임 ---------- */
function allCands(t) {
  const out = [];
  if (S.game.src.place) t.places.filter(p => !p.done).forEach(p => out.push({ key: 'p:' + p.id, label: p.name, kind: 'place', id: p.id }));
  if (S.game.src.food) t.foods.filter(f => !f.visited).forEach(f => out.push({ key: 'f:' + f.id, label: f.name, kind: 'food', id: f.id }));
  S.game.custom.forEach(s => out.push({ key: 'c:' + s, label: s, kind: 'custom' }));
  return out;
}
const activeCands = t => allCands(t).filter(c => !S.game.off.has(c.key));
function gameView(t) {
  const all = allCands(t);
  const g = S.game;
  const np = t.places.filter(p => !p.done).length, nf = t.foods.filter(f => !f.visited).length;
  let h = '<section class="card stack"><div><p class="eyebrow">고민될 땐 게임으로</p><h2 style="font-size:20px">어디 갈지 정해 드릴게요</h2></div>' +
    '<div class="seg" role="group" aria-label="게임 종류">' + [['roulette', '룰렛'], ['ladder', '사다리'], ['cards', '카드 뽑기'], ['course', '추천 코스']].map(([k, n]) =>
      '<button data-act="game-type" data-v="' + k + '" aria-pressed="' + (g.type === k) + '">' + n + '</button>').join('') + '</div>' +
    '<div class="field"><span class="lbl">후보 가져오기</span><div class="chips">' +
      '<button class="chip" data-act="game-src" data-v="place" aria-pressed="' + g.src.place + '">가볼 곳 ' + np + '</button>' +
      '<button class="chip" data-act="game-src" data-v="food" aria-pressed="' + g.src.food + '">맛집 위시 ' + nf + '</button>' +
      '<button class="chip" data-act="menu-set">메뉴 고민 세트</button></div></div>' +
    '<div class="field"><span class="lbl">후보 ' + activeCands(t).length + '개 · 눌러서 빼거나 넣기</span>' +
      (all.length ? '<div class="chips">' + all.map(c => '<button class="chip' + (g.off.has(c.key) ? ' off' : '') + '" data-act="cand-toggle" data-v="' + esc(c.key) + '">' + esc(c.label) +
        (c.kind === 'custom' ? '<span class="x" data-act="cand-remove" data-v="' + esc(c.label) + '" aria-label="삭제">×</span>' : '') + '</button>').join('') + '</div>'
        : '<p class="hint">가볼 곳·맛집 위시리스트에서 가져오거나, 아래에 직접 적어 주세요.</p>') +
    '</div>' +
    '<form class="addrow" id="candForm"><input id="candIn" placeholder="후보 직접 추가 (예: 야경 보러 가기)" maxlength="40" autocomplete="off"><button class="btn" type="submit">추가</button></form>' +
  '</section>' +
  '<section class="card game-stage" id="stage"></section><div id="gameResult"></div>';
  return h;
}
function mountGame(t) {
  const stage = $('#stage');
  if (!stage) return;
  const c = activeCands(t);
  const form = $('#candForm');
  form.onsubmit = e => {

  const act = r.kind === 'place' ? (rp ? '<a class="btn" href="' + esc(mapURL(rp, cur())) + '" target="_blank" rel="noopener">구글맵에서 보기</a>' : '') + '<button class="btn primary" data-act="res-place" data-id="' + r.id + '">다녀오면 방문 체크하기</button>'

function showResult(r) {

/* ---------- 시트(입력 창) ---------- */
let lastFocus = null;
function openSheet(title, body, onMount) {
  lastFocus = document.activeElement;
  $('#sheetRoot').innerHTML = '<div class="sheet-bg" data-act="close-sheet"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="' + esc(title) + '"><div class="sheet-in">' +
    '<div class="sheet-h"><h2>' + esc(title) + '</h2><button class="icon-btn" type="button" data-act="close-sheet" aria-label="닫기">×</button></div>' + body + '</div></div>';
  document.body.classList.add('noscroll');
  const sh = $('.sheet');
  if (onMount) onMount(sh);
}
function closeSheet() {
  $('#sheetRoot').innerHTML = '';
  if (!S.viewer) document.body.classList.remove('noscroll');
  if (lastFocus && document.contains(lastFocus)) try { lastFocus.focus({ preventScroll: true }); } catch (e) {}
}
function confirmSheet(msg, okLabel, fn) {
  openSheet('확인', '<div class="stack"><p style="margin:0">' + esc(msg) + '</p><div class="actions"><button class="btn" type="button" data-act="close-sheet">취소</button>' +
    '<button class="btn primary" type="button" id="okBtn" style="background:var(--danger);border-color:var(--danger)">' + esc(okLabel) + '</button></div></div>', sh => {
    $('#okBtn', sh).onclick = () => { closeSheet(); fn(); };
  });
}
function segHTML(id, opts, val) {
  return '<div class="seg' + (opts.length > 3 ? ' wrap' : '') + '" id="' + id + '" role="group">' + opts.map(([v, n]) =>
    '<button type="button" data-seg="' + esc(v) + '" aria-pressed="' + (String(v) === String(val)) + '">' + esc(n) + '</button>').join('') + '</div>';
}
const segVal = (sh, id) => { const b = $('#' + id + ' [aria-pressed="true"]', sh); return b ? b.dataset.seg : null; };
function curOptions(sel) {
  return Object.keys(CUR).map(k => '<option value="' + k + '"' + (k === sel ? ' selected' : '') + '>' + k + ' · ' + CUR[k][1] + '</option>').join('');
}

/* 여행 */
function tripSheet(t) {
  const isNew = !t;
  const today = todayISO();
  const v = t || { country: '', city: '', code: '', flag: '', start: today, end: addDays(today, 3), cur: 'JPY', rate: RATE.JPY, rateMode: 'live', budget: '', budgetCur: 'KRW' };
  const rateNum = r => fmtN(r, 2).replace(/,/g, '');
  let liveHit = null;
  const body = '<form class="form" id="tf" novalidate>' +
    (isNew ? '<div class="field"><span class="lbl">빠른 선택</span><div class="chips scroll">' + PRESETS.map((p, i) =>
      '<button type="button" class="chip" data-preset="' + i + '">' + p[0] + ' ' + p[2] + '</button>').join('') + '</div></div>' : '') +
    '<div class="row2"><label class="field"><span class="lbl">나라</span><input id="t-country" value="' + esc(v.country) + '" placeholder="일본" required></label>' +
    '<label class="field"><span class="lbl">도시</span><input id="t-city" value="' + esc(v.city) + '" placeholder="도쿄" required></label></div>' +
    '<div class="row2"><label class="field"><span class="lbl">출발일</span><input type="date" id="t-start" value="' + v.start + '" required></label>' +
    '<label class="field"><span class="lbl">귀국일</span><input type="date" id="t-end" value="' + v.end + '" required></label></div>' +
    '<label class="field"><span class="lbl">현지 통화</span><select id="t-cur">' + curOptions(v.cur) + '</select></label>' +
    '<div class="field" id="rateField"><span class="lbl">환율</span>' + segHTML('t-rmode', [['live', '실시간 환율'], ['manual', '직접 입력']], v.rateMode === 'manual' ? 'manual' : 'live') +
      '<div class="rate-in"><span id="rateLbl">' + unitLabel(v.cur) + ' =</span><input id="t-rate" inputmode="decimal" value="' + rateNum((Number(v.rate) || 0) * unitOf(v.cur)) + '"><span>원</span></div>' +
      '<p class="hint" id="rateHint"></p></div>' +
    '<div class="field"><span class="lbl">예산</span><div class="row2"><input id="t-budget" inputmode="decimal" placeholder="예: 1,500,000" value="' + (v.budget ? fmtN(v.budget, 2) : '') + '">' +
      segHTML('t-bcur', [['KRW', '원'], ['LOCAL', v.cur]], v.budgetCur === 'KRW' || !v.budgetCur ? 'KRW' : 'LOCAL') + '</div></div>' +
    '<div class="row2"><label class="field"><span class="lbl">도시 코드 (영문 3자, 선택)</span><input id="t-code" maxlength="4" value="' + esc(v.code) + '" placeholder="TYO" autocapitalize="characters"></label>' +
    '<label class="field"><span class="lbl">국기 (선택)</span><input id="t-flag" value="' + esc(v.flag) + '" placeholder="🇯🇵" maxlength="8"></label></div>' +
    '<p class="hint" id="tErr" style="color:var(--danger)" hidden></p>' +
    '<div class="actions">' + (!isNew ? '<button type="button" class="btn danger" id="delTrip">여행 삭제</button>' : '') +
    '<button class="btn primary" type="submit">' + (isNew ? '여행 시작' : '저장') + '</button></div></form>';
  openSheet(isNew ? '새 여행' : '여행 정보', body, sh => {
    const f = id => $('#' + id, sh);
    const mode = () => segVal(sh, 't-rmode');
    const setMode = m => $$('#t-rmode [data-seg]', sh).forEach(b => b.setAttribute('aria-pressed', String(b.dataset.seg === m)));
    const hint = h => { f('rateHint').innerHTML = h; };
    const loadLive = force => {
      const c = f('t-cur').value;
      liveHit = null;
      if (c === 'KRW' || mode() !== 'live') return;
      hint('실시간 환율 불러오는 중…');
      RateSvc.get(c, force).then(r => {
        if (f('t-cur').value !== c || mode() !== 'live') return;
        liveHit = r;
        f('t-rate').value = rateNum(r.rate * unitOf(c));
        hint(esc(r.src + (r.at ? ' · ' + r.at : '')) + ' 기준이에요. 앱을 열 때마다 최신 환율로 바뀌고, 지출은 적은 시점의 환율로 계산해요.');
      }, () => {
        if (f('t-cur').value !== c || mode() !== 'live') return;
        hint('지금 화면에서는 실시간 환율을 불러올 수 없어요. 위 숫자를 고치거나 ‘직접 입력’을 쓰세요. ' + naverRate(c));
      });
    };
    const syncMode = () => {
      if (mode() === 'live') loadLive(true);
      else hint('환전한 환율을 적어 두면 모든 지출을 이 환율로 계산해요. ' + naverRate(f('t-cur').value));
    };
    sh.addEventListener('click', ev => { if (ev.target.closest('#t-rmode')) setTimeout(syncMode, 0); });
    f('t-rate').addEventListener('input', () => { if (mode() === 'live') { setMode('manual'); liveHit = null; hint('직접 입력으로 바꿨어요. ' + naverRate(f('t-cur').value)); } });
    const syncCur = () => {
      const c = f('t-cur').value;
      f('rateLbl').textContent = unitLabel(c) + ' =';
      const krw = c === 'KRW';
      f('rateField').hidden = krw;
      const loc = $('#t-bcur [data-seg="LOCAL"]', sh);
      loc.textContent = c; loc.hidden = krw;
      if (krw) { $('#t-bcur [data-seg="KRW"]', sh).setAttribute('aria-pressed', 'true'); loc.setAttribute('aria-pressed', 'false'); }
    };
    const setCur = c => { f('t-cur').value = c; f('t-rate').value = rateNum((RATE[c] || 0) * unitOf(c)); syncCur(); syncMode(); };
    f('t-cur').onchange = () => setCur(f('t-cur').value);
    syncCur(); syncMode();
    $$('[data-preset]', sh).forEach(b => b.onclick = () => {
      const p = PRESETS[+b.dataset.preset];
      $$('[data-preset]', sh).forEach(x => x.setAttribute('aria-pressed', String(x === b)));
      f('t-flag').value = p[0]; f('t-country').value = p[1]; f('t-city').value = p[2]; f('t-code').value = p[3];
      setCur(p[4]);
    });
    if (!isNew) f('delTrip').onclick = () => confirmSheet('‘' + t.city + '’ 여행과 지출·방문지·맛집 기록을 모두 지울까요? 되돌릴 수 없어요.', '삭제', () => {
      Photos.removeAll(t.places.concat(t.foods)); Store.remove(t.id); S.view = 'home'; render(); toast('여행을 삭제했어요');
    });
    f('tf').onsubmit = e => {
      e.preventDefault();
      const country = f('t-country').value.trim(), city = f('t-city').value.trim();
      const start = f('t-start').value, end = f('t-end').value;
      const err = f('tErr');
      const fail = m => { err.textContent = m; err.hidden = false; };
      if (!country || !city) return fail('나라와 도시를 적어 주세요.');
      if (!start || !end) return fail('출발일과 귀국일을 골라 주세요.');
      if (end < start) return fail('귀국일이 출발일보다 빨라요. 날짜를 확인해 주세요.');
      const c = f('t-cur').value;
      const rate = c === 'KRW' ? 1 : num(f('t-rate').value) / unitOf(c);
      if (c !== 'KRW' && !(rate > 0)) return fail('환율을 숫자로 적어 주세요. 예: ' + unitLabel(c) + ' = ' + fmtN((RATE[c] || 1) * unitOf(c)) + '원');
      const rm = c === 'KRW' ? 'manual' : mode();
      const bcur = segVal(sh, 't-bcur') === 'LOCAL' && c !== 'KRW' ? c : 'KRW';
      const data = { country, city, start, end, cur: c, rate, rateMode: rm,
        rateAt: rm === 'live' && liveHit ? liveHit.at : (t && t.cur === c && rm === 'live' ? t.rateAt || '' : ''), rateSrc: rm === 'live' && liveHit ? liveHit.src : (t && t.cur === c && rm === 'live' ? t.rateSrc || '' : ''),
        budget: num(f('t-budget').value), budgetCur: bcur,
        code: f('t-code').value.trim().toUpperCase().slice(0, 4), flag: f('t-flag').value.trim() };
      if (isNew) {
        const nt = normTrip(Object.assign({ id: uid(), createdAt: Date.now() }, data));
        S.trips[nt.id] = nt; S.tripId = nt.id; S.view = 'trip'; S.tab = 'sum'; S.game = freshGame();
        if (rm === 'live' && liveHit) S.rateState[nt.id] = 'ok';
        closeSheet(); commit(nt); window.scrollTo(0, 0); toast('좋은 여행 되세요!'); refreshRate(nt);
      } else {
        if (rm === 'live' && liveHit) S.rateState[t.id] = 'ok';
        Object.assign(t, data); closeSheet(); commit(t); toast('저장했어요'); refreshRate(t);
      }
    };
  });
}

/* 지출 */
function expenseSheet(t, id) {
  const e = id ? t.expenses.find(x => x.id === id) : null;
  if (id && !e) return;
  const st = stats(t);
  const defDate = st.today > t.end ? t.end : st.today;
  const v = e || { amt: '', cur: S.lastCur && (S.lastCur === 'KRW' || S.lastCur === t.cur) ? S.lastCur : t.cur, cat: 'food', pay: 'card', date: defDate, memo: '' };
  const body = '<form class="form" id="ef" novalidate>' +
    '<div class="field"><span class="lbl">금액</span><input id="e-amt" class="amount-in" inputmode="decimal" placeholder="0" value="' + (v.amt !== '' ? fmtN(v.amt, 2) : '') + '" autocomplete="off">' +
    (t.cur !== 'KRW' ? segHTML('e-cur', [[t.cur, t.cur + ' ' + (CUR[t.cur] || ['', ''])[0]], ['KRW', '원 (KRW)']], v.cur) : '') +
    '<div class="conv" id="e-conv"></div></div>' +
    '<div class="field"><span class="lbl">분류</span>' + segHTML('e-cat', CATS.map(c => [c.k, c.n]), v.cat) + '</div>' +
    '<div class="row2"><label class="field"><span class="lbl">날짜</span><input type="date" id="e-date" value="' + v.date + '"></label>' +
    '<div class="field"><span class="lbl">결제</span>' + segHTML('e-pay', [['card', '카드'], ['cash', '현금']], v.pay) + '</div></div>' +
    '<label class="field"><span class="lbl">메모 (선택)</span><input id="e-memo" value="' + esc(v.memo) + '" placeholder="예: 스카이트리 입장권" maxlength="60"></label>' +
    '<p class="hint" id="eErr" style="color:var(--danger)" hidden></p>' +
    '<div class="actions">' + (e ? '<button type="button" class="btn danger" id="delE">삭제</button>' : '') + '<button class="btn primary" type="submit">' + (e ? '저장' : '추가') + '</button></div></form>';
  openSheet(e ? '지출 수정' : '지출 추가', body, sh => {
    const amt = $('#e-amt', sh);
    const conv = () => {
      const c = t.cur === 'KRW' ? 'KRW' : segVal(sh, 'e-cur');
      const n = num(amt.value);
      $('#e-conv', sh).textContent = n ? (c === 'KRW' ? (t.cur !== 'KRW' && t.rate ? '≈ ' + money(n / t.rate, t.cur) : '') : '≈ ' + won(toKRW(t, n, c)) + ' · ' + rateText(t)) : (t.cur !== 'KRW' ? rateText(t) : '');
    };
    amt.oninput = () => {
      const raw = amt.value.replace(/[^0-9.]/g, '');
      const parts = raw.split('.');
      const intPart = parts[0] ? Number(parts[0]).toLocaleString('ko-KR') : '';
      amt.value = parts.length > 1 ? intPart + '.' + parts.slice(1).join('').slice(0, 2) : intPart;
      conv();
    };
    sh.addEventListener('click', ev => { if (ev.target.closest('#e-cur')) setTimeout(conv, 0); });
    conv();
    if (!e) setTimeout(() => amt.focus(), 250);
    if (e) $('#delE', sh).onclick = () => { t.expenses = t.expenses.filter(x => x.id !== e.id); closeSheet(); commit(t); toast('지출을 지웠어요'); };
    $('#ef', sh).onsubmit = ev => {
      ev.preventDefault();
      const n = num(amt.value);
      if (!(n > 0)) { const er = $('#eErr', sh); er.textContent = '금액을 적어 주세요.'; er.hidden = false; amt.focus(); return; }
      const c = t.cur === 'KRW' ? 'KRW' : segVal(sh, 'e-cur');
      const data = { amt: n, cur: c, cat: segVal(sh, 'e-cat') || 'etc', pay: segVal(sh, 'e-pay') || 'card', date: $('#e-date', sh).value || defDate, memo: $('#e-memo', sh).value.trim() };
      S.lastCur = c;
      // 실시간 환율을 받아 온 상태면 지금 환율을 이 지출에 고정해요
      if (c !== 'KRW' && (!e || e.cur !== c)) data.rate = t.rateMode !== 'manual' && S.rateState[t.id] === 'ok' ? t.rate : undefined;
      if (c === 'KRW') data.rate = undefined;
      if (e) Object.assign(e, data); else t.expenses.push(Object.assign({ id: uid(), ts: Date.now() }, data));
      closeSheet(); commit(t); toast(e ? '저장했어요' : won(c === 'KRW' ? n : n * (Number(data.rate) || Number(t.rate) || 0)) + ' 기록했어요');
    };
  });
}

      ev.preventDefault();

      const map = mapVal();

      closeSheet(); commit(t);

}

/* 구글맵 입력칸 (방문지·맛집 공통) */
function mapFieldHTML(pre, val, what) {
  return '<div class="field"><span class="lbl">구글맵 (선택)</span><div class="addrow"><input id="' + pre + '-map" inputmode="url" autocomplete="off" placeholder="구글맵 공유 링크 붙여넣기" value="' + esc(val || '') + '">' +
    '<a class="btn primary" id="' + pre + '-find" target="_blank" rel="noopener" href="#">지도에서 찾기</a></div>' +
    '<p class="hint">‘지도에서 찾기’로 ' + what + '을 검색한 뒤, 구글맵에서 공유 → 링크 복사 → 여기에 붙여 넣으면 이름도 자동으로 채워져요.</p></div>';
}
function wireMapField(sh, pre, t, fallback) {
  const q = id => $('#' + pre + '-' + id, sh);
  const upd = () => { q('find').href = mapURL({ name: q('name').value.trim() || fallback, area: q('area').value.trim() }, t); };
  ['name', 'area'].forEach(k => q(k).addEventListener('input', upd));
  upd();
  q('map').addEventListener('paste', ev => {
    const r = parseMapShare(ev.clipboardData ? ev.clipboardData.getData('text') : '');
    if (!r.url) return;
    ev.preventDefault();
    q('map').value = r.url;
    if (r.name && !q('name').value.trim()) { q('name').value = r.name; upd(); }
  });
  // 붙여넣기 이벤트 없이 글자가 들어온 경우(자동완성 등)도 링크만 골라내요
  q('map').addEventListener('change', () => {
    const r = parseMapShare(q('map').value);
    if (r.url) { q('map').value = r.url; if (r.name && !q('name').value.trim()) { q('name').value = r.name; upd(); } }
  });
  // 저장할 때 쓰는 값: 링크 | '' | null(잘못된 값)
  return () => { const raw = q('map').value.trim(); if (!raw) return ''; return parseMapShare(raw).url || null; };
}

/* 맛집 */
function foodSheet(t, id, opts) {
  opts = opts || {};
  const f0 = id ? t.foods.find(x => x.id === id) : null;
  if (id && !f0) return;
  const v = f0 ? Object.assign({}, f0) : { name: '', menu: '', area: '', memo: '', rating: 0, visited: S.foodTab === 'done', price: '', date: todayISO() };
  if (opts.visited) v.visited = true;
  let rating = v.rating || 0;
  const body = '<form class="form" id="ff" novalidate>' +
    '<label class="field"><span class="lbl">가게 이름</span><input id="f-name" value="' + esc(v.name) + '" placeholder="예: 이치란 라멘" maxlength="40"></label>' +
    '<div class="row2"><label class="field"><span class="lbl">먹은/먹을 메뉴</span><input id="f-menu" value="' + esc(v.menu) + '" placeholder="돈코츠 라멘" maxlength="40"></label>' +
    '<label class="field"><span class="lbl">동네</span><input id="f-area" value="' + esc(v.area) + '" placeholder="신주쿠" maxlength="30"></label></div>' +
    mapFieldHTML('f', v.map, '가게') +
    '<div class="field"><span class="lbl">상태</span>' + segHTML('f-vis', [['0', '가고 싶은 곳'], ['1', '다녀왔어요']], v.visited ? '1' : '0') + '</div>' +
    '<div id="visBox" class="form"' + (v.visited ? '' : ' hidden') + '>' +
      '<div class="field"><span class="lbl">별점</span><div id="f-stars">' + starsHTML(rating, { lg: true, act: 'sheet-rate' }) + '</div></div>' +
      '<div class="row2"><label class="field"><span class="lbl">가격 (' + t.cur + ', 선택)</span><input id="f-price" inputmode="decimal" value="' + (v.price ? fmtN(v.price, 2) : '') + '"></label>' +
      '<label class="field"><span class="lbl">날짜</span><input type="date" id="f-date" value="' + (v.date || todayISO()) + '"></label></div>' +
    '</div>' +
    '<label class="field"><span class="lbl">한 줄 평 · 메모</span><input id="f-memo" value="' + esc(v.memo) + '" placeholder="예: 국물이 진하고 줄 30분" maxlength="80"></label>' +
    (f0 ? '<div class="field"><span class="lbl">사진</span><div class="ph-grid" data-kind="food" data-id="' + f0.id + '">' + photoGridInner('food', f0) + '</div></div>' : '') +
    '<p class="hint" id="fErr" style="color:var(--danger)" hidden></p>' +
    '<div class="actions">' + (f0 ? '<button type="button" class="btn danger" id="delF">삭제</button>' : '') + '<button class="btn primary" type="submit">' + (f0 ? '저장' : '추가') + '</button></div></form>';
  openSheet(f0 ? (opts.visited ? '별점 남기기' : '맛집 수정') : '맛집 추가', body, sh => {
    sh.addEventListener('click', ev => {
      const s = ev.target.closest('[data-act="sheet-rate"]');
      if (s) { ev.stopPropagation(); rating = +s.dataset.v; $('#f-stars', sh).innerHTML = starsHTML(rating, { lg: true, act: 'sheet-rate' }); }
      if (ev.target.closest('#f-vis')) setTimeout(() => { $('#visBox', sh).hidden = segVal(sh, 'f-vis') !== '1'; }, 0);
    }, true);
    const mapVal = wireMapField(sh, 'f', t, '맛집');
    if (!f0) setTimeout(() => $('#f-name', sh).focus(), 250);
    if (f0) $('#delF', sh).onclick = () => { Photos.removeAll([f0]); t.foods = t.foods.filter(x => x.id !== f0.id); closeSheet(); commit(t); };
    hydratePhotos();
    $('#ff', sh).onsubmit = ev => {
      ev.preventDefault();
      const name = $('#f-name', sh).value.trim();
      if (!name) { const er = $('#fErr', sh); er.textContent = '가게 이름을 적어 주세요.'; er.hidden = false; return; }
      const visited = segVal(sh, 'f-vis') === '1';
      const map = mapVal();
      if (map === null) { const er = $('#fErr', sh); er.textContent = '구글맵 링크는 https:// 로 시작하는 주소를 붙여 넣어 주세요.'; er.hidden = false; return; }
      const data = { map, name, menu: $('#f-menu', sh).value.trim(), area: $('#f-area', sh).value.trim(), memo: $('#f-memo', sh).value.trim(), visited,
        rating: visited ? rating : 0, price: visited ? num($('#f-price', sh).value) : 0, priceCur: t.cur, date: visited ? ($('#f-date', sh).value || todayISO()) : '' };
      if (f0) Object.assign(f0, data); else t.foods.push(Object.assign({ id: uid() }, data));
      S.foodTab = visited ? 'done' : 'wish';
      if (opts.fromGame) { S.game.result = null; S.tab = 'food'; }
      closeSheet(); commit(t); toast(visited ? (rating ? '별점 ' + rating + '점 저장했어요' : '저장했어요') : '위시리스트에 담았어요');
    };
  });
}

/* 백업 */
function backupSheet() {
  const data = JSON.stringify({ app: 'travel-notebook', v: 1, trips: Object.values(S.trips) });
  const body = '<div class="stack"><p class="hint">' + storageNote() + '</p>' +
    '<div class="field"><span class="lbl">백업하기</span><p class="hint">모든 여행 기록을 글자로 복사해요. 메모 앱 등에 붙여 두면 다른 곳에서 복원할 수 있어요. 사진은 백업 텍스트에 들어가지 않아요.</p>' +
    '<button class="btn" type="button" id="copyB">백업 텍스트 복사 (' + Object.keys(S.trips).length + '개 여행)</button><textarea id="bOut" readonly hidden style="width:100%;min-height:90px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:10px;font-size:12px"></textarea></div>' +
    '<div class="field"><span class="lbl">복원하기</span><textarea id="bIn" placeholder="복사해 둔 백업 텍스트를 붙여 넣으세요" style="width:100%;min-height:90px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:10px;font-size:16px"></textarea>' +
    '<button class="btn primary" type="button" id="restoreB">불러오기</button><p class="hint" id="bMsg"></p></div></div>';
  openSheet('백업 · 복원', body, sh => {
    $('#copyB', sh).onclick = () => {
      const out = $('#bOut', sh);
      const fallback = () => { out.hidden = false; out.value = data; out.focus(); out.select(); $('#bMsg', sh).textContent = ''; toast('아래 글자를 길게 눌러 복사하세요'); };
      try {
        navigator.clipboard.writeText(data).then(() => toast('백업 텍스트를 복사했어요'), fallback);
      } catch (e) { fallback(); }
    };
    $('#restoreB', sh).onclick = () => {
      const msg = $('#bMsg', sh);
      try {
        const o = JSON.parse($('#bIn', sh).value);
        const list = Array.isArray(o) ? o : (o && Array.isArray(o.trips) ? o.trips : null);
        if (!list) throw new Error('x');
        let n = 0;
        list.forEach(t => { if (t && t.id && t.city && t.start && t.end) { S.trips[t.id] = normTrip(t); Store.save(t.id); n++; } });
        if (!n) throw new Error('x');
        closeSheet(); render(); toast(n + '개 여행을 불러왔어요');
      } catch (e) { msg.textContent = '백업 텍스트를 읽지 못했어요. 복사한 글자 전체를 그대로 붙여 넣어 주세요.'; msg.style.color = 'var(--danger)'; }
    };
  });
}
