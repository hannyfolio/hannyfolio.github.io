<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#eef1f6" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0b111d" media="(prefers-color-scheme: dark)" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="여행 수첩" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<!-- A:HEAD -->
<title>여행 수첩</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 레이아웃: 폰 폭 한 줄 컬럼(최대 560px) · 여행은 탑승권 카드 · 여행 안에서는 하단 탭 5개 */
:root {
  --bg: #eef1f6;
  --card: #ffffff;
  --ink: #132036;
  --sub: #5f6b84;
  --line: #dbe1ea;
  --accent: #2c56e0;
  --accent-ink: #ffffff;
  --accent-soft: #e2e8fb;
  --stamp: #c93d27;
  --star: #e89a0c;
  --ok: #1d8f59;
  --warn: #c77a00;
  --danger: #cf3535;
  --shade: rgba(19, 32, 54, .45);
  --g1: #cfdbff; --g2: #ffe2a8; --g3: #c9eedc; --g4: #ffd0c7; --g5: #e3d6ff; --g6: #c8ecf6;
  --f-body: "IBM Plex Sans KR", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --f-code: "Bebas Neue", "Arial Narrow", Impact, sans-serif;
  --r: 14px;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b111d; --card: #141c2c; --ink: #e6ebf4; --sub: #93a0b9; --line: #253049;
    --accent: #7f9bff; --accent-ink: #0b111d; --accent-soft: #1c2848; --stamp: #ff6d57;
    --star: #ffbe45; --ok: #41cf8f; --warn: #ffb13b; --danger: #ff6f6f; --shade: rgba(0, 0, 0, .6);
    --g1: #2a3a6e; --g2: #5a4720; --g3: #1f4a3a; --g4: #5a2c28; --g5: #3d3266; --g6: #1d4554;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b111d; --card: #141c2c; --ink: #e6ebf4; --sub: #93a0b9; --line: #253049;
  --accent: #7f9bff; --accent-ink: #0b111d; --accent-soft: #1c2848; --stamp: #ff6d57;
  --star: #ffbe45; --ok: #41cf8f; --warn: #ffb13b; --danger: #ff6f6f; --shade: rgba(0, 0, 0, .6);
  --g1: #2a3a6e; --g2: #5a4720; --g3: #1f4a3a; --g4: #5a2c28; --g5: #3d3266; --g6: #1d4554;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
body.noscroll { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

.shell { max-width: 560px; margin: 0 auto; padding-bottom: 120px; }

/* 헤더 */
.hdr {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  display: flex; align-items: center; gap: 10px; padding-block: 12px;
  box-shadow: 0 0 0 100vmax var(--bg); clip-path: inset(0 -100vmax);
}
.wordmark { font-family: var(--f-code); font-size: 30px; letter-spacing: .04em; line-height: 1; }
.wordmark small { font-family: var(--f-body); font-size: 13px; font-weight: 600; color: var(--sub); letter-spacing: 0; margin-left: 6px; }
.hdr-title { flex: 1; min-width: 0; }
.hdr-title b { display: block; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hdr-title span { display: block; font-size: 12px; color: var(--sub); }
.icon-btn {
  width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--card);
  display: inline-grid; place-items: center; flex: none; font-size: 20px; line-height: 1;
}
.icon-btn svg { width: 20px; height: 20px; }
.spacer { flex: 1; }
.text-btn { border: 0; background: none; color: var(--accent); font-weight: 600; padding: 8px 4px; }

/* 공통 */
.card { background: var(--card); border-radius: var(--r); padding: 16px; border: 1px solid var(--line); }
.stack { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
.stack > * { min-width: 0; }
.sec { margin: 4px 0 0; font-size: 13px; font-weight: 600; color: var(--sub); letter-spacing: .02em; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .02em; color: var(--sub); margin: 0; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.muted { color: var(--sub); }
.hint { font-size: 12px; color: var(--sub); margin: 0; }
.center { text-align: center; }
.btn {
  border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 11px 16px;
  font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px;
}
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--danger); background: transparent; border-color: transparent; }
.btn.block { width: 100%; }
.btn.small { min-height: 36px; padding: 6px 12px; font-size: 13px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; margin-inline: -4px; padding: 2px 4px 6px; scrollbar-width: none; }
.chips.scroll::-webkit-scrollbar { display: none; }
.chip {
  border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 12px;
  font-size: 13px; white-space: nowrap; flex: none;
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip.off { text-decoration: line-through; color: var(--sub); background: transparent; }
.chip .x { margin-left: 4px; color: var(--sub); }
.tag { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); vertical-align: 2px; }

/* 탑승권 카드 */
.pass {
  display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--card);
  border-radius: 16px; padding: 0; position: relative;
}
.pass-top { display: flex; gap: 14px; align-items: center; padding: 16px 16px 14px; }
.pass-code { font-family: var(--f-code); font-size: 46px; line-height: .9; letter-spacing: .03em; color: var(--accent); min-width: 72px; }
.pass-code.kr { font-family: var(--f-body); font-weight: 700; font-size: 22px; letter-spacing: -.02em; }
.pass-info { flex: 1; min-width: 0; }
.pass-city { font-weight: 700; font-size: 17px; }
.pass-meta { font-size: 12.5px; color: var(--sub); }
.pass-status {
  font-family: var(--f-mono); font-size: 11px; font-weight: 600; letter-spacing: .06em; padding: 4px 8px;
  border-radius: 8px; border: 1.5px solid currentColor; white-space: nowrap; flex: none;
}
.s-ongoing { color: var(--accent); }
.s-upcoming { color: var(--warn); }
.s-done { color: var(--sub); }
.perf { position: relative; height: 0; border-top: 1.5px dashed var(--line); margin-inline: 14px; }
.perf::before, .perf::after {
  content: ""; position: absolute; top: -10px; width: 18px; height: 18px; border-radius: 50%;
  background: var(--bg); border: 1px solid var(--line);
}
.perf::before { left: -24px; clip-path: inset(0 0 0 50%); }
.perf::after { right: -24px; clip-path: inset(0 50% 0 0); }
.pass-bot { padding: 12px 16px 16px; display: grid; gap: 8px; }
.pass-figs { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--sub); }
.pass-figs b { color: var(--ink); font-weight: 600; }
.new-pass {
  width: 100%; border: 1.5px dashed var(--line); background: transparent; border-radius: 16px; padding: 18px;
  color: var(--accent); font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px;
}

/* 미터 */
.meter { height: 8px; border-radius: 99px; background: var(--accent-soft); overflow: hidden; }
.meter > i { display: block; height: 100%; border-radius: 99px; background: var(--accent); }
.meter.warn > i { background: var(--warn); }
.meter.over > i { background: var(--danger); }
.meter.ok > i { background: var(--ok); }

/* 빈 상태 */
.empty { text-align: center; padding: 32px 16px; display: grid; gap: 10px; justify-items: center; }
.empty .big { font-family: var(--f-code); font-size: 54px; color: var(--accent); letter-spacing: .05em; line-height: 1; }
.empty p { margin: 0; color: var(--sub); max-width: 32ch; }

/* 요약 */
.hero-num { font-size: 40px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }
.hero-num.neg { color: var(--danger); }
.stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; min-width: 0; }
.stat .l { font-size: 12px; color: var(--sub); }
.stat .v { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; word-break: keep-all; overflow-wrap: anywhere; }
.stat .s { font-size: 11px; color: var(--sub); }
.hbars { display: grid; gap: 10px; }
.hbar { display: grid; grid-template-columns: 76px 1fr; gap: 10px; align-items: center; font-size: 13px; }
.hbar .track { display: flex; align-items: center; gap: 8px; min-width: 0; }
.hbar .fill { height: 14px; border-radius: 0 4px 4px 0; background: var(--accent); min-width: 2px; }
.hbar .val { font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.cols-wrap { overflow-x: auto; }
.cols { position: relative; display: flex; align-items: flex-end; gap: 2px; height: 140px; padding-top: 18px; border-bottom: 1px solid var(--line); min-width: 100%; }
.col { flex: 1 0 22px; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; }
.col i { display: block; width: min(24px, 70%); background: var(--accent); border-radius: 4px 4px 0 0; opacity: .55; min-height: 0; }
.col.today i { opacity: 1; }
.col-labels { display: flex; gap: 2px; font-size: 10.5px; color: var(--sub); min-width: 100%; }
.col-labels span { flex: 1 0 22px; text-align: center; }
.col-labels .today { color: var(--ink); font-weight: 700; }
.refline { position: absolute; left: 0; right: 0; border-top: 1px solid var(--sub); opacity: .6; pointer-events: none; }
.refline span { position: absolute; right: 0; top: -17px; font-size: 10.5px; color: var(--sub); background: var(--card); padding: 0 4px; }
.mini-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.mini { display: grid; gap: 6px; text-align: left; }

/* 리스트 */
.list { display: grid; gap: 8px; }
.day-h { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: var(--sub); padding: 6px 2px 0; }
.day-h b { color: var(--ink); }
.item {
  display: flex; gap: 12px; align-items: center; width: 100%; text-align: left;
  background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.item-main { flex: 1; min-width: 0; }
.item-title { font-weight: 600; overflow-wrap: anywhere; }
.item-sub { font-size: 12.5px; color: var(--sub); overflow-wrap: anywhere; }
.item-amt { text-align: right; flex: none; }
.item-amt b { display: block; font-variant-numeric: tabular-nums; }
.item-amt span { font-size: 12px; color: var(--sub); font-variant-numeric: tabular-nums; }
.cat-dot {
  width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; flex: none;
  font-size: 13px; font-weight: 700; color: var(--ink);
}
.check {
  width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); background: transparent; flex: none;
  display: grid; place-items: center; padding: 0;
}
.check svg { width: 16px; height: 16px; opacity: 0; }
.check.on { background: var(--ok); border-color: var(--ok); color: #fff; }
.check.on svg { opacity: 1; }
.item.done .item-title { color: var(--sub); }
.stamp {
  font-family: var(--f-mono); font-size: 10px; font-weight: 600; letter-spacing: .08em; color: var(--stamp);
  border: 1.5px solid var(--stamp); border-radius: 6px; padding: 2px 6px; transform: rotate(-6deg); flex: none; text-align: center; line-height: 1.25;
}
.stars { display: inline-flex; gap: 0; }
.star { border: 0; background: none; padding: 3px; color: var(--line); display: grid; }
.star svg { width: 20px; height: 20px; }
.star.on { color: var(--star); }
.stars.lg .star svg { width: 32px; height: 32px; }
.stars.ro .star { padding: 0 1px; cursor: default; }
.stars.ro .star svg { width: 14px; height: 14px; }
.rank { font-family: var(--f-code); font-size: 26px; color: var(--accent); width: 28px; text-align: center; flex: none; line-height: 1; }
.seg { display: flex; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { white-space: nowrap; flex: 1; border: 0; background: transparent; border-radius: 9px; padding: 8px 10px; font-size: 13.5px; font-weight: 600; color: var(--sub); min-height: 38px; }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.seg.wrap { flex-wrap: wrap; }
.seg.wrap button { flex: 1 0 calc(25% - 3px); }

/* 하단 탭 · FAB */
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--card); border-top: 1px solid var(--line);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
}
.nav-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.nav button { border: 0; background: none; display: grid; justify-items: center; gap: 2px; padding: 6px 0; font-size: 11px; font-weight: 600; color: var(--sub); }
.nav button svg { width: 22px; height: 22px; }
.nav button[aria-current="page"] { color: var(--accent); }
.fab {
  position: fixed; z-index: 7; right: max(16px, calc(env(safe-area-inset-right, 0px) + 16px));
  bottom: calc(76px + env(safe-area-inset-bottom, 0px));
  border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-weight: 700;
  padding: 14px 20px; box-shadow: 0 6px 20px rgba(20, 40, 120, .3); display: flex; gap: 6px; align-items: center;
}
@media (min-width: 600px) { .fab { right: calc(50% - 264px); } }

/* 시트 */
.sheet-bg { position: fixed; inset: 0; background: var(--shade); z-index: 20; animation: fade .18s ease; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--card); border-radius: 20px 20px 0 0;
  max-height: 92vh; max-height: 92dvh; overflow-y: auto; animation: up .22s ease;
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.sheet-in { max-width: 560px; margin: 0 auto; }
.sheet-h { position: sticky; top: 0; background: var(--card); display: flex; align-items: center; gap: 8px; padding-block: 16px 10px; z-index: 1; }
.sheet-h h2 { font-size: 18px; flex: 1; }
@keyframes up { from { transform: translateY(30px); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }
.form { display: grid; gap: 14px; }
.field { display: grid; gap: 6px; min-width: 0; }
.lbl { font-size: 12.5px; font-weight: 600; color: var(--sub); }
.form input:not([type="checkbox"]), .form select, .form textarea {
  width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 11px 12px; min-height: 46px; font-size: 16px;
}
.form textarea { min-height: 90px; resize: vertical; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.amount-in { font-size: 28px !important; font-weight: 700; font-family: var(--f-mono); }
.conv { font-size: 13px; color: var(--sub); font-variant-numeric: tabular-nums; min-height: 1.5em; }
.actions { display: flex; gap: 8px; justify-content: space-between; padding-top: 6px; }
.actions .btn.primary { flex: 1; }

/* 게임 */
.game-stage { display: grid; gap: 14px; justify-items: center; }
.wheel-wrap { position: relative; width: min(100%, 330px); }
.wheel-wrap canvas { width: 100%; aspect-ratio: 1; display: block; max-width: 100%; }
.pointer {
  position: absolute; left: 50%; top: -6px; transform: translateX(-50%); width: 0; height: 0;
  border-left: 13px solid transparent; border-right: 13px solid transparent; border-top: 24px solid var(--stamp);
  filter: drop-shadow(0 2px 2px rgba(0,0,0,.2));
}
.hub {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 64px; height: 64px; border-radius: 50%;
  background: var(--ink); color: var(--bg); border: 4px solid var(--card); font-family: var(--f-code); font-size: 22px; letter-spacing: .05em;
}
.ladder { width: 100%; display: grid; gap: 4px; }
.lad-row { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 2px; }
.lad-btn { justify-self: center; width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--accent); background: var(--card); color: var(--accent); font-family: var(--f-code); font-size: 20px; }
.lad-btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.ladder canvas { width: 100%; height: 240px; display: block; }
.lad-res {
  font-size: 12px; text-align: center; font-weight: 600; padding: 6px 2px; border-radius: 8px; background: var(--bg);
  overflow-wrap: anywhere; word-break: keep-all; min-height: 44px; display: grid; place-items: center; line-height: 1.25;
}
.lad-res.hide { font-family: var(--f-code); font-size: 20px; color: var(--sub); }
.lad-res.hit { background: var(--accent); color: var(--accent-ink); }
.cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; }
.pcard { aspect-ratio: 3 / 4; border: 0; background: none; padding: 0; perspective: 600px; position: relative; max-width: 100%; }
.pcard .in { position: absolute; inset: 0; transition: transform .6s ease; transform-style: preserve-3d; }
.pcard.flip .in { transform: rotateY(180deg); }
.pcard .face {
  position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 12px;
  display: grid; place-items: center; padding: 8px; text-align: center;
}
.pcard .back {
  background: var(--accent); color: var(--accent-ink); font-family: var(--f-code); font-size: 34px;
  background-image: repeating-linear-gradient(45deg, transparent 0 8px, rgba(255,255,255,.08) 8px 16px);
}
.pcard .front { background: var(--card); border: 2px solid var(--line); transform: rotateY(180deg); font-weight: 700; font-size: 14px; overflow-wrap: anywhere; word-break: keep-all; }
.pcard.chosen .front { border-color: var(--stamp); color: var(--stamp); }
.pcard.dim { opacity: .55; }
.cards.shuffle .pcard { animation: jig .5s ease; }
.cards.shuffle .pcard:nth-child(2n) { animation-delay: .05s; }
.cards.shuffle .pcard:nth-child(3n) { animation-delay: .1s; }
@keyframes jig { 25% { transform: translate(6px, -8px) rotate(4deg); } 60% { transform: translate(-6px, 4px) rotate(-4deg); } }
.result {
  border: 2px solid var(--stamp); border-radius: 16px; padding: 18px 16px; text-align: center; display: grid; gap: 10px;
  background: var(--card); animation: pop .35s ease;
}
.result .eyebrow { color: var(--stamp); }
.result h3 { font-size: 24px; overflow-wrap: anywhere; }
@keyframes pop { from { transform: scale(.92); opacity: 0; } }
.addrow { display: flex; gap: 8px; }
.addrow input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 10px 12px; font-size: 16px; }

.toast {
  position: fixed; left: 50%; bottom: calc(140px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 30;

/* ---------- 저장소: claude 계정(가능하면) → 아니면 이 기기 ---------- */
function readLocal() {
  try { const o = JSON.parse(localStorage.getItem(KEY) || '{}'); return o && typeof o === 'object' ? o : {}; } catch (e) { return {}; }
}
function writeLocal() { try { localStorage.setItem(KEY, JSON.stringify(S.trips)); } catch (e) {} }
function clearLocal() { try { localStorage.removeItem(KEY); } catch (e) {} }

const Store = {
  mode: 'pending', col: null, timers: new Map(), writing: new Set(), again: new Set(), first: true,
  async init() {
    const local = readLocal();
    Object.values(local).forEach(t => { if (t && t.id) S.trips[t.id] = normTrip(t); });
    const c = window.claude;
    if (!c || typeof c.use !== 'function') { this.mode = 'local'; render(); refreshActiveRates(); return; }
    render();
    try {
      const [db, user] = await Promise.all([c.use('db'), c.use('user')]);
      const id = user ? await user.id() : null;
      if (!db || !id) { this.mode = 'local'; render(); refreshActiveRates(); return; }
      this.col = db.collection('data/users/' + id);
      this.mode = 'cloud';
      this.col.onSnapshot(snap => this.onSnap(snap), () => {
        this.mode = 'local'; writeLocal(); toast('연결이 끊겨 이 기기에 임시 저장해요'); render();
      });
    } catch (e) { this.mode = 'local'; render(); refreshActiveRates(); }
  },
  onSnap(snap) {
    const seen = new Set();
    const next = {};
    snap.docs.forEach(d => {
      const v = d.data();
      if (!v || v.kind !== 'trip') return;
      seen.add(d.id);
      next[d.id] = normTrip(JSON.parse(JSON.stringify(v)));
    });
    const busy = id => this.timers.has(id) || this.writing.has(id);
    if (this.first) {
      this.first = false;
      // 이 기기에만 있던 여행은 계정으로 옮겨요
      const local = readLocal();
      Object.values(S.trips).concat(Object.values(local)).forEach(t => {
        if (t && t.id && !seen.has(t.id)) { next[t.id] = normTrip(t); this.save(t.id, next); }
      });
      clearLocal();
      S.trips = next;
      setTimeout(refreshActiveRates, 0);
    } else {
      Object.keys(next).forEach(id => {
        if (busy(id)) return;
        const old = S.trips[id];
        if (old && JSON.stringify(old) === JSON.stringify(next[id])) return;
        S.trips[id] = next[id];
      });
      Object.keys(S.trips).forEach(id => { if (!seen.has(id) && !busy(id)) delete S.trips[id]; });
    }
    render();
  },
  save(id) {
    const t = S.trips[id];
    if (t) t.updatedAt = Date.now();
    if (this.mode !== 'cloud') { writeLocal(); return; }
    clearTimeout(this.timers.get(id));
    this.timers.set(id, setTimeout(() => { this.timers.delete(id); this.flush(id); }, 350));
  },
  remove(id) { delete S.trips[id]; this.save(id); },
  async flush(id, retried) {
    if (this.writing.has(id)) { this.again.add(id); return; }
    this.writing.add(id);
    try {
      const t = S.trips[id];
      if (t) await this.col.doc(id).set(JSON.parse(JSON.stringify(t)));
      else await this.col.doc(id).delete();
    } catch (e) {
      const code = e && e.code;
      if (code === 'unavailable' && !retried) setTimeout(() => this.flush(id, true), 800 + Math.random() * 800);
      else toast(code === 'quota_exceeded' ? '저장 공간이 가득 찼어요. 지난 여행을 정리해 주세요' : '저장하지 못했어요. 잠시 후 다시 해 주세요');
    } finally {
      this.writing.delete(id);
      if (this.again.has(id)) { this.again.delete(id); this.flush(id); }
    }
  },
  flushAll() { this.timers.forEach((tm, id) => { clearTimeout(tm); this.timers.delete(id); this.flush(id); }); }
};

function openIDB() {
  return new Promise((res, rej) => {

function idbReq(db, mode, fn) {

    tx.oncomplete = () => res(q && q.result); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
  });
}
const Photos = {
  mode: 'pending', api: null, idb: null, urls: {}, ready: null,
  init() {
    this.ready = (async () => {
      const c = window.claude;

        try { const a = await c.use('assets'); if (a) { this.api = a; this.mode = 'cloud'; return; } } catch (e) {}
      }
      try { this.idb = await openIDB(); this.mode = 'local'; } catch (e) { this.mode = 'none'; }
    })();
    return this.ready;
  },
  src(ph) {
    if (ph.a) return window.claude ? '/_blob/' + ph.a : '';
    return (ph.l && this.urls[ph.l]) || '';
  },
  async localURL(id) {
    if (this.urls[id]) return this.urls[id];
    await this.ready;
    if (!this.idb) return '';
    try {
      const blob = await idbReq(this.idb, 'readonly', st => st.get(id));
      if (!blob) return '';
      return (this.urls[id] = URL.createObjectURL(blob));
    } catch (e) { return ''; }
  },
  async add(blob) {
    await this.ready;
    if (this.mode === 'cloud') {

      catch (e) {
        if (e && e.code === 'store_unavailable') { await new Promise(z => setTimeout(z, 1200)); r = await this.api.upload(blob, { type: 'image/jpeg' }); }

      }
      return { a: r.id, ts: Date.now() };
    }
    if (this.mode === 'local') {
      const id = uid();
      await idbReq(this.idb, 'readwrite', st => st.put(blob, id));
      this.urls[id] = URL.createObjectURL(blob);
      return { l: id, ts: Date.now() };
    }
    throw { code: 'no_store' };
  },
  remove(ph) {
    if (!ph) return;
    if (ph.a && this.api) this.api.delete(ph.a).catch(() => {});
    if (ph.l) {
      if (this.urls[ph.l]) { URL.revokeObjectURL(this.urls[ph.l]); delete this.urls[ph.l]; }
      if (this.idb) idbReq(this.idb, 'readwrite', st => st.delete(ph.l)).catch(() => {});
    }
  },

};

async function compressImage(file) {
  const MAX = 1600;
  let src, w, h, done = () => {};
  try {
    src = await createImageBitmap(file, { imageOrientation: 'from-image' });
    w = src.width; h = src.height; done = () => { if (src.close) src.close(); };
  } catch (e) {
    src = await new Promise((res, rej) => {
      const u = URL.createObjectURL(file); const im = new Image();
      im.onload = () => { URL.revokeObjectURL(u); res(im); };
      im.onerror = () => { URL.revokeObjectURL(u); rej({ code: 'decode' }); };
      im.src = u;
    });
    w = src.naturalWidth; h = src.naturalHeight;
  }
  const k = Math.min(1, MAX / Math.max(w, h));
  const cv = document.createElement('canvas');
  cv.width = Math.max(1, Math.round(w * k)); cv.height = Math.max(1, Math.round(h * k));
  cv.getContext('2d').drawImage(src, 0, 0, cv.width, cv.height);
  done();
  return new Promise((res, rej) => cv.toBlob(b => b ? res(b) : rej({ code: 'decode' }), 'image/jpeg', 0.82));
}

const isShopE = e => e.cat === 'shop';
// 관세 (여행자 휴대품, 1인 기준 추정): 면세 한도 $800, 초과분 일반 물품 간이세율 20%, 자진신고 시 30% 감면(최대 20만 원)
const DUTY = { freeUSD: 800, rate: 0.2, selfOff: 0.3, selfCap: 200000 };
function usdKRW(t) { return t.cur === 'USD' && t.rate ? Number(t.rate) : (S.usdRate || RATE.USD); }
function customs(t) {
  const krw = t.expenses.filter(e => isShopE(e) && !e.noDuty).reduce((s, e) => s + expKRW(t, e), 0);
  const fx = usdKRW(t), usd = krw / fx;
  const overUSD = Math.max(0, usd - DUTY.freeUSD);
  const tax = Math.round(overUSD * fx * DUTY.rate);
  const selfTax = Math.round(tax - Math.min(tax * DUTY.selfOff, DUTY.selfCap));
  return { krw, usd, overUSD, tax, selfTax, leftUSD: Math.max(0, DUTY.freeUSD - usd), fx };
}
function stats(t) {
  const allSpent = t.expenses.reduce((s, e) => s + expKRW(t, e), 0);
  const shopSpent = t.expenses.filter(isShopE).reduce((s, e) => s + expKRW(t, e), 0);
  const shopBudget = t.shopBudget ? toKRW(t, Number(t.shopBudget), t.budgetCur || 'KRW') : 0;
  // 여행비 예산·하루 사용 가능 금액은 쇼핑을 빼고 계산
  const spent = allSpent - shopSpent;
  const spentLocal = t.expenses.filter(e => e.cur === t.cur).reduce((s, e) => s + e.amt, 0);
  const budget = t.budget ? toKRW(t, Number(t.budget), t.budgetCur || 'KRW') : 0;
  const days = Math.max(1, diffDays(t.start, t.end) + 1);
  const today = todayISO();
  let status = 'ongoing', dayIdx = 0;
  if (today < t.start) status = 'upcoming';
  else if (today > t.end) status = 'done';
  else dayIdx = diffDays(t.start, today) + 1;
  const remainDays = status === 'upcoming' ? days : status === 'ongoing' ? days - dayIdx + 1 : 0;
  const todaySpent = t.expenses.filter(e => e.date === today && !isShopE(e)).reduce((s, e) => s + expKRW(t, e), 0);
  const spentBeforeToday = t.expenses.filter(e => e.date < today && !isShopE(e)).reduce((s, e) => s + expKRW(t, e), 0);
  const left = budget - spent;
  // 오늘 포함 남은 날로 나눈 하루 사용 가능 금액 (오늘 쓴 돈은 오늘 몫에서 빠짐)
  const perDay = remainDays > 0 ? (budget - spentBeforeToday) / remainDays : 0;
  const placesDone = t.places.filter(p => p.done).length;
  const rated = t.foods.filter(f => f.visited && f.rating > 0);
  const avgRating = rated.length ? rated.reduce((s, f) => s + f.rating, 0) / rated.length : 0;
  return { spent, allSpent, shopSpent, shopBudget, spentLocal, budget, left, days, status, dayIdx, remainDays, todaySpent, perDay, placesDone, rated, avgRating, today };
}
function meterCls(p) { return p >= 1 ? 'over' : p >= .8 ? 'warn' : ''; }

/* ---------- 렌더 ---------- */
function render() {
  if (S.game.busy) { S.renderPending = true; return; }
  S.renderPending = false;
  let t = cur();
  if (S.view === 'trip' && !t) { S.view = 'home'; t = null; }
  $('#hdr').innerHTML = S.view === 'home' ? homeHeader() : tripHeader(t);
  $('#main').innerHTML = S.view === 'home' ? homeView() : tripView(t);
  const nav = $('#nav');
  nav.hidden = S.view !== 'trip';
  if (S.view === 'trip') {
    nav.innerHTML = '<div class="nav-in">' + TABS.map(([k, n]) =>
      '<button data-act="tab" data-tab="' + k + '"' + (S.tab === k ? ' aria-current="page"' : '') + '>' + ICON[k] + '<span>' + n + '</span></button>').join('') + '</div>';
  }
  const fab = $('#fab');
  const fabLabel = { exp: '지출 추가', place: '가볼 곳 추가', food: '맛집 추가' }[S.tab];
  fab.hidden = !(S.view === 'trip' && fabLabel);
  if (fabLabel) fab.innerHTML = '<span aria-hidden="true">+</span> ' + fabLabel;
  if (S.view === 'trip' && S.tab === 'game') mountGame(t);
  hydratePhotos();
}

function homeHeader() {
  return '<div class="wordmark">TRAVEL<small>여행 수첩</small></div><span class="spacer"></span>' +
    '<button class="icon-btn" data-act="backup" aria-label="백업과 복원">' + ICON.menu + '</button>';
}
function tripHeader(t) {
  return '<button class="icon-btn" data-act="home" aria-label="여행 목록">' + ICON.back + '</button>' +
    '<div class="hdr-title"><b>' + esc((t.flag ? t.flag + ' ' : '') + t.city) + '</b><span>' + esc(t.country) + ' · ' + fmtMD(t.start) + ' – ' + fmtMD(t.end) + '</span></div>' +
    '<button class="icon-btn" data-act="edit-trip" aria-label="여행 정보 수정">' + ICON.edit + '</button>';
}

function sortedTrips() {
  const order = { ongoing: 0, upcoming: 1, done: 2 };
  return Object.values(S.trips).map(t => ({ t, st: stats(t) })).sort((a, b) => {
    if (order[a.st.status] !== order[b.st.status]) return order[a.st.status] - order[b.st.status];
    return a.st.status === 'done' ? (a.t.start < b.t.start ? 1 : -1) : (a.t.start < b.t.start ? -1 : 1);
  });
}
function passCard(t, st) {
  const code = t.code ? '<div class="pass-code">' + esc(t.code) + '</div>' : '<div class="pass-code kr">' + esc(t.city.slice(0, 4)) + '</div>';
  const p = st.budget ? st.spent / st.budget : 0;
  let stLabel = st.status === 'upcoming' ? 'D-' + diffDays(st.today, t.start) : st.status === 'ongoing' ? 'DAY ' + st.dayIdx + '/' + st.days : '다녀옴';
  return '<button class="pass" data-act="open-trip" data-id="' + t.id + '">' +
    '<div class="pass-top">' + code +
      '<div class="pass-info"><div class="pass-city">' + esc((t.flag ? t.flag + ' ' : '') + t.city) + (t.sample ? ' <span class="tag">예시</span>' : '') + '</div>' +
      '<div class="pass-meta">' + esc(t.country) + ' · ' + fmtMD(t.start) + ' – ' + fmtMD(t.end) + ' · ' + st.days + '일</div></div>' +
      '<span class="pass-status s-' + st.status + '">' + stLabel + '</span>' +
    '</div><div class="perf"></div>' +
    '<div class="pass-bot">' +
      (st.budget ? '<div class="meter ' + meterCls(p) + '"><i style="width:' + Math.min(100, p * 100).toFixed(1) + '%"></i></div>' : '') +
      '<div class="pass-figs"><span>사용 <b>' + won(st.spent) + '</b>' + (st.budget ? ' / ' + won(st.budget) : '') + '</span>' +
      '<span>방문 <b>' + st.placesDone + '/' + t.places.length + '</b> · 맛집 <b>' + t.foods.filter(f => f.visited).length + '</b></span></div>' +
    '</div></button>';
}
function homeView() {
  const list = sortedTrips();
  let h = '';
  if (!list.length) {
    if (Store.mode === 'pending') return '<p class="muted center" style="padding:40px 0">여행 기록을 불러오는 중…</p>';
    h += '<section class="card empty"><div class="big">ICN → ?</div><h2>첫 여행을 기록해 보세요</h2>' +
      '<p>나라와 도시, 예산을 적으면 지출·방문지·맛집 별점을 여행마다 따로 모아 볼 수 있어요.</p>' +
      '<button class="btn primary" data-act="new-trip">새 여행 만들기</button>' +
      '<button class="btn ghost" data-act="sample">예시 여행으로 둘러보기</button></section>';
  } else {
    h += '<button class="new-pass" data-act="new-trip"><span aria-hidden="true">+</span> 새 여행</button>';
    let lastGroup = '';
    const gname = { ongoing: '여행 중', upcoming: '다가오는 여행', done: '지난 여행' };
    list.forEach(({ t, st }) => {
      if (st.status !== lastGroup) { lastGroup = st.status; h += '<p class="sec">' + gname[st.status] + '</p>'; }
      h += passCard(t, st);
    });
  }
  h += '<div class="foot">' + (canInstall() ? '<div class="row" style="justify-content:center"><button class="btn small" data-act="install">홈 화면에 앱 추가</button><button class="btn small" data-act="share-app">친구에게 앱 공유</button></div>' : '') +
    (window.claude ? '<p class="hint">실시간 환율과 홈 화면 설치는 사이트 버전에서 돼요. <a href="' + SITE_URL + '" target="_blank" rel="noopener">사이트에서 열기</a></p>' : '') +
    '<p class="hint">' + storageNote() + '</p></div>';
  return h;
}
function storageNote() {
  if (Store.mode === 'cloud') return 'Claude 계정에 저장돼요. 다른 기기에서 열어도 그대로 보여요.';
  if (Store.mode === 'pending') return '저장소 연결 중…';
  return '이 기기 브라우저에 저장돼요. 메뉴의 백업으로 옮길 수 있어요.';
}

function tripView(t) {
  if (S.tab === 'exp') return expView(t);
  if (S.tab === 'place') return placeView(t);
  if (S.tab === 'food') return foodView(t);
  if (S.tab === 'game') return gameView(t);
  return sumView(t);
}

/* 요약 */
function sumView(t) {
  const st = stats(t);
  const p = st.budget ? st.spent / st.budget : 0;
  let h = '<section class="card stack">';
  if (st.budget) {
    h += '<p class="eyebrow">남은 여행비 · ' + (st.status === 'upcoming' ? '출발 D-' + diffDays(st.today, t.start) : st.status === 'ongoing' ? 'DAY ' + st.dayIdx + ' / ' + st.days : '여행 끝') + '</p>' +
      '<div class="hero-num' + (st.left < 0 ? ' neg' : '') + '">' + (st.left < 0 ? '-' : '') + won(Math.abs(st.left)) + '</div>' +
      '<div class="meter ' + meterCls(p) + '"><i style="width:' + Math.min(100, p * 100).toFixed(1) + '%"></i></div>' +
      '<div class="pass-figs"><span>여행비 <b>' + won(st.budget) + '</b></span><span>사용 <b>' + won(st.spent) + '</b> (' + Math.round(p * 100) + '%)</span></div>' +
      '<p class="hint">쇼핑은 따로 계산해요.</p>';
    if (st.left < 0) h += '<p class="hint" style="color:var(--danger)">여행비를 ' + won(-st.left) + ' 넘었어요.</p>';
  } else {
    h += '<p class="eyebrow">여행비 지출 (쇼핑 제외)</p><div class="hero-num">' + won(st.spent) + '</div>' +
      '<p class="hint">여행비 예산을 정하면 남은 금액과 하루 사용 가능 금액을 보여 드려요.</p>' +
      '<button class="btn small" data-act="edit-trip">예산 정하기</button>';
  }
  h += '</section>';

  h += shopCard(t, st);
  h += rateCard(t);
  const localTxt = t.cur !== 'KRW' ? money(st.spentLocal, t.cur) : won(st.spent);
  h += '<div class="stat-row">' +
    '<div class="stat"><div class="l">하루 사용 가능</div><div class="v">' + (st.budget && st.remainDays ? (st.perDay < 0 ? '0원' : shortWon(st.perDay) + '원') : '–') + '</div><div class="s">' + (st.remainDays ? '남은 ' + st.remainDays + '일 기준' : '여행 끝') + '</div></div>' +
    '<div class="stat"><div class="l">오늘 쓴 돈</div><div class="v">' + shortWon(st.todaySpent) + '원</div><div class="s">' + (st.budget && st.remainDays && st.status !== 'upcoming' ? (st.perDay - st.todaySpent >= 0 ? shortWon(st.perDay - st.todaySpent) + '원 남음' : shortWon(st.todaySpent - st.perDay) + '원 초과') : fmtMD(st.today)) + '</div></div>' +
    '<div class="stat"><div class="l">' + (t.cur !== 'KRW' ? '현지 통화 지출' : '지출 건수') + '</div><div class="v">' + (t.cur !== 'KRW' ? esc(localTxt) : t.expenses.length + '건') + '</div><div class="s">' + (t.cur !== 'KRW' ? esc(rateText(t)) : '') + '</div></div>' +
  '</div>';

  // 카테고리별
  const byCat = CATS.map(c => ({ c, v: t.expenses.filter(e => e.cat === c.k).reduce((s, e) => s + expKRW(t, e), 0) })).filter(x => x.v > 0).sort((a, b) => b.v - a.v);
  h += '<section class="card stack"><h3 class="sec">어디에 썼나</h3>';
  if (!byCat.length) h += '<p class="hint">아직 지출이 없어요. 아래 지출 탭에서 첫 지출을 적어 보세요.</p>';
  else {
    const max = byCat[0].v;
    h += '<div class="hbars">' + byCat.map(x =>
      '<div class="hbar" title="' + esc(x.c.n) + ' ' + won(x.v) + '"><span>' + x.c.n + '</span><div class="track"><div class="fill" style="width:calc((100% - 96px) * ' + (x.v / max).toFixed(3) + ')"></div><span class="val">' + shortWon(x.v) + '원 · ' + Math.round(x.v / st.allSpent * 100) + '%</span></div></div>').join('') + '</div>';
  }
  h += '</section>';

  // 일별
  const days = [];
  for (let i = 0; i < st.days && i < 60; i++) days.push(addDays(t.start, i));
  const dayVals = days.map(d => t.expenses.filter(e => e.date === d && !isShopE(e)).reduce((s, e) => s + expKRW(t, e), 0));
  const outside = t.expenses.filter(e => (e.date < t.start || e.date > t.end) && !isShopE(e)).reduce((s, e) => s + expKRW(t, e), 0);
  const avgBudget = st.budget ? (st.budget - outside) / st.days : 0;
  const maxV = Math.max(1, ...dayVals, avgBudget);
  h += '<section class="card stack"><h3 class="sec">날짜별 여행비 (쇼핑 제외)</h3><div class="cols-wrap"><div class="cols" style="min-width:' + (days.length * 24) + 'px">' +
    (avgBudget > 0 ? '<div class="refline" style="bottom:' + (avgBudget / maxV * 122).toFixed(1) + 'px"><span>하루 예산 ' + shortWon(avgBudget) + '</span></div>' : '') +
    days.map((d, i) => '<div class="col' + (d === st.today ? ' today' : '') + '" title="' + fmtMDW(d) + ' ' + won(dayVals[i]) + '"><i style="height:' + (dayVals[i] / maxV * 122).toFixed(1) + 'px"></i></div>').join('') +
    '</div><div class="col-labels" style="min-width:' + (days.length * 24) + 'px">' + days.map(d => '<span' + (d === st.today ? ' class="today"' : '') + '>' + parseD(d).getDate() + '</span>').join('') + '</div></div>' +
    (outside ? '<p class="hint">여행 기간 밖 지출(항공권·숙소 예약 등) ' + won(outside) + '은 날짜별 그래프에서 빠져 있어요.</p>' : '') + '</section>';

  // 방문지·맛집
  const pp = t.places.length ? st.placesDone / t.places.length : 0;
  const best = st.rated.slice().sort((a, b) => b.rating - a.rating)[0];
  const photos = allPhotos(t);
  if (photos.length) {
    h += '<section class="card stack"><h3 class="sec">여행 사진 ' + photos.length + '장</h3><div class="strip">' + photos.slice(0, 30).map((x, i) =>
      '<button class="thumb" data-act="photo-all" data-i="' + i + '" aria-label="' + esc(x.label) + ' 사진">' + imgTag(x.ph, '') + '</button>').join('') + '</div></section>';
  }
  if (t.courses.length) h += savedCourseCard(t);
  h += '<div class="mini-grid">' +
    '<button class="card mini" data-act="tab" data-tab="place"><span class="sec">방문지</span><b class="hero-num" style="font-size:26px">' + st.placesDone + '<span class="muted" style="font-size:16px"> / ' + t.places.length + '곳</span></b><div class="meter ok"><i style="width:' + (pp * 100).toFixed(1) + '%"></i></div></button>' +
    '<button class="card mini" data-act="tab" data-tab="food"><span class="sec">맛집 평균</span><b class="hero-num" style="font-size:26px">' + (st.avgRating ? st.avgRating.toFixed(1) : '–') + '<span class="muted" style="font-size:16px"> / 5</span></b>' +
      '<span class="item-sub">' + (best ? '최고: ' + esc(best.name) : '아직 평가한 곳이 없어요') + '</span></button>' +
  '</div>';
  return h;
}

function rateCard(t) {
  if (t.cur === 'KRW') return '';
  const live = t.rateMode !== 'manual';
  const stt = S.rateState[t.id];
  let sub, extra = '';
  if (!live) { sub = '직접 입력한 환율로 계산해요'; extra = naverRate(t.cur); }
  else if (stt === 'loading' && !t.rateAt) sub = '실시간 환율 확인 중…';
  else if (stt === 'fail') { sub = '실시간 환율에 연결하지 못해 ' + (t.rateAt ? t.rateAt + ' 환율' : '저장된 환율') + '로 계산 중'; extra = naverRate(t.cur) + (window.claude ? ' · <a href="' + SITE_URL + '" target="_blank" rel="noopener">사이트 버전 열기</a>' : ''); }
  else sub = '실시간 · ' + [t.rateSrc, t.rateAt].filter(Boolean).join(' ');
  return '<section class="card rate-card"><div class="rate-main"><span class="l">환율</span><b>' + esc(rateText(t)) + '</b><span class="hint">' + esc(sub) + (extra ? ' · ' + extra : '') + '</span></div>' +
    (live ? '<button class="icon-btn" data-act="rate-refresh" aria-label="환율 새로고침"' + (stt === 'loading' ? ' disabled' : '') + '>↻</button>' : '<button class="btn small" data-act="edit-trip">바꾸기</button>') + '</section>';
}

function shopCard(t, st) {
  const abroad = t.cur !== 'KRW' || (t.country && t.country !== '한국');
  if (!st.shopBudget && !st.shopSpent) {
    return '<section class="card rate-card"><div class="rate-main"><span class="l">쇼핑비</span><b>' + won(0) + '</b><span class="hint">쇼핑비 예산을 따로 정할 수 있어요' + (abroad ? ' · 관세도 자동 계산' : '') + '</span></div><button class="btn small" data-act="edit-trip">정하기</button></section>';
  }
  const p = st.shopBudget ? st.shopSpent / st.shopBudget : 0;
  let h = '<section class="card stack"><div class="row" style="justify-content:space-between"><h3 class="sec">쇼핑비</h3>' +
    (st.shopBudget ? '<span class="num" style="font-weight:700' + (st.shopBudget - st.shopSpent < 0 ? ';color:var(--danger)' : '') + '">' + won(Math.abs(st.shopBudget - st.shopSpent)) + (st.shopBudget - st.shopSpent < 0 ? ' 초과' : ' 남음') + '</span>' : '') + '</div>' +
    (st.shopBudget ? '<div class="meter ' + meterCls(p) + '"><i style="width:' + Math.min(100, p * 100).toFixed(1) + '%"></i></div>' : '') +
    '<div class="pass-figs"><span>예산 <b>' + (st.shopBudget ? won(st.shopBudget) : '–') + '</b></span><span>사용 <b>' + won(st.shopSpent) + '</b></span></div>';
  if (abroad) {
    const c = customs(t);
    const dp = Math.min(1, c.usd / DUTY.freeUSD);
    h += '<div class="duty' + (c.overUSD > 0 ? ' over' : '') + '"><div class="row" style="justify-content:space-between"><b>관세 예상</b><span class="num">$' + fmtN(c.usd, 0) + ' / $' + DUTY.freeUSD + '</span></div>' +
      '<div class="meter ' + (c.overUSD > 0 ? 'over' : 'ok') + '"><i style="width:' + (dp * 100).toFixed(1) + '%"></i></div>' +
      (c.overUSD > 0
        ? '<p class="duty-main">약 <b>' + won(c.tax) + '</b> <span class="hint">· 자진신고 시 약 ' + won(c.selfTax) + '</span></p>'
        : '<p class="duty-main">면세 한도까지 <b>$' + fmtN(c.leftUSD, 0) + '</b> 남았어요</p>') +
      '<p class="hint">1인 기준 추정 · 한도 $800 초과분에 간이세율 20% · 술·담배·향수는 별도</p></div>';
  }
  return h + '</section>';
}

/* 지출 */
function expView(t) {
  const st = stats(t);
  let list = t.expenses.slice();
  if (S.expFilter !== 'all') list = list.filter(e => e.cat === S.expFilter);
  const sum = list.reduce((s, e) => s + expKRW(t, e), 0);
  let h = '<section class="card"><p class="eyebrow">' + (S.expFilter === 'all' ? '총 지출' : CAT[S.expFilter].n) + '</p><div class="hero-num" style="font-size:32px">' + won(sum) + '</div>' +
    (S.expFilter === 'all' ? '<p class="hint">여행비 ' + won(st.spent) + ' · 쇼핑 ' + won(st.shopSpent) + '</p>' : '') + '</section>';
  h += '<div class="chips scroll">' + [['all', '전체']].concat(CATS.map(c => [c.k, c.n])).map(([k, n]) =>
    '<button class="chip" data-act="exp-filter" data-v="' + k + '" aria-pressed="' + (S.expFilter === k) + '">' + n + '</button>').join('') + '</div>';
  if (!list.length) {
    h += '<div class="card empty"><p>' + (t.expenses.length ? '이 분류의 지출이 없어요.' : '아직 적은 지출이 없어요. 오른쪽 아래 <b>지출 추가</b>로 첫 지출을 적어 보세요.') + '</p></div>';
    return h;
  }
  list.sort((a, b) => b.date.localeCompare(a.date) || (b.ts || 0) - (a.ts || 0));
  const groups = [];
  list.forEach(e => { const g = groups[groups.length - 1]; if (g && g.date === e.date) g.items.push(e); else groups.push({ date: e.date, items: [e] }); });
  h += '<div class="list">';
  groups.forEach(g => {
    const tot = g.items.reduce((s, e) => s + expKRW(t, e), 0);
    const dn = g.date >= t.start && g.date <= t.end ? ' · DAY ' + (diffDays(t.start, g.date) + 1) : g.date < t.start ? ' · 출발 전' : ' · 귀국 후';
    h += '<div class="day-h"><span><b>' + fmtMDW(g.date) + '</b>' + dn + '</span><span class="num">' + won(tot) + '</span></div>';
    g.items.forEach(e => {
      const c = CAT[e.cat] || CAT.etc;
      h += '<button class="item" data-act="exp-edit" data-id="' + e.id + '"><span class="cat-dot" style="background:' + c.g + '">' + c.n[0] + '</span>' +
        '<span class="item-main"><span class="item-title">' + esc(e.memo || c.n) + '</span><span class="item-sub" style="display:block">' + c.n + ' · ' + (e.pay === 'cash' ? '현금' : '카드') + '</span></span>' +
        '<span class="item-amt"><b>' + esc(money(e.amt, e.cur)) + '</b>' + (e.cur !== 'KRW' ? '<span>' + won(expKRW(t, e)) + '</span>' : '') + '</span></button>';
    });
  });
  return h + '</div>';
}

function courseItems(t, cands) {

    if (c.kind === 'place') {
      const p = itemOf(t, 'place', c.id) || {};
      return Object.assign({}, c, { area: p.area || '', type: 'place', night: p.theme === 'night' || NIGHT_RE.test(c.label + ' ' + (p.memo || '')) });
    }
    if (c.kind === 'food') {
      const f = itemOf(t, 'food', c.id) || {};
      const txt = c.label + ' ' + (f.menu || '');
      return Object.assign({}, c, { area: f.area || '', type: f.theme === 'cafe' || SNACK_RE.test(txt) ? 'snack' : 'meal', night: NIGHT_RE.test(txt) });
    }
    return Object.assign({}, c, { area: '', type: 'any', night: false });
  });
}
function fillSlot(C, i, avoid) {
  const s = SLOTS[i];
  const used = new Set(C.stops.filter((x, j) => j !== i && x).map(x => x.key));
  const prev = C.stops[i - 1];
  const free = C.items.filter(x => !used.has(x.key) && x.key !== avoid);
  const pick = pool => {
    if (!pool.length) return null;
    const near = pool.filter(x => x.area && (x.area === C.anchor || (prev && x.area === prev.area)));
    return rnd(near.length && Math.random() < .75 ? near : pool);
  };
  const any = free.filter(x => x.type === 'any');
  let it = any.length && Math.random() < .25 ? pick(any) : null;
  if (!it) {
    if (s.want === 'night') it = pick(free.filter(x => x.night)) || pick(free.filter(x => x.type === 'place'));
    else if (s.want === 'place') it = pick(free.filter(x => x.type === 'place' && !x.night)); // 야경 명소는 밤 시간에만
    else it = pick(free.filter(x => x.type === s.want));
  }
  if (!it) it = pick(any);
  if (it) return { key: it.key, label: it.label, kind: it.kind, id: it.id || '', area: it.area };
  const fl = FILLERS[s.want].filter(x => 'free:' + x !== avoid && !used.has('free:' + x));
  const label = rnd(fl.length ? fl : FILLERS[s.want]);
  return { key: 'free:' + label, label, kind: 'free', id: '', area: '' };
}
function buildCourse(t, cands) {
  const items = courseItems(t, cands);
  const areas = [...new Set(items.filter(x => x.type !== 'any').map(x => x.area).filter(Boolean))];
  const C = { items, anchor: areas.length ? rnd(areas) : '', stops: [] };
  SLOTS.forEach((s, i) => { C.stops[i] = fillSlot(C, i); });
  return C;
}
function courseDirURL(t, stops) {
  const q = stops.filter(x => x.kind !== 'free').map(x => x.label + ' ' + t.city);
  if (!q.length) return '';
  if (q.length === 1) return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q[0]);
  return 'https://www.google.com/maps/dir/?api=1&origin=' + encodeURIComponent(q[0]) + '&destination=' + encodeURIComponent(q[q.length - 1]) +
    (q.length > 2 ? '&waypoints=' + encodeURIComponent(q.slice(1, -1).slice(0, 8).join('|')) : '');
}
function stopMap(t, x) {
  if (x.kind === 'free') return '<span></span>';
  const it = itemOf(t, x.kind, x.id) || { name: x.label };
  return mapBtn({ name: it.name || x.label, area: it.area, map: it.map }, t);
}
function stopsHTML(t, stops, editable) {
  return '<ol class="course">' + stops.map((x, i) => {
    const it = x.kind === 'place' ? itemOf(t, 'place', x.id) : x.kind === 'food' ? itemOf(t, 'food', x.id) : null;
    const done = it && (it.done || it.visited);
    return '<li class="stop' + (x.kind === 'free' ? ' free' : '') + (done && !editable ? ' done' : '') + '"><span class="time num">' + SLOTS[i].time + '</span><span class="dot"></span>' +
      '<div class="stop-main"><span class="slot">' + SLOTS[i].n + (x.area ? ' · ' + esc(x.area) : '') + (x.kind === 'free' ? ' · 자유 일정' : '') + (done && !editable ? ' · 다녀옴' : '') + '</span><b>' + esc(x.label) + '</b></div>' +
      stopMap(t, x) + (editable ? '<button class="icon-btn sm" data-act="course-swap" data-i="' + i + '" aria-label="' + SLOTS[i].n + ' 일정 바꾸기">↻</button>' : '<span></span>') + '</li>';
  }).join('') + '</ol>';
}
function mountCourse(stage, c, t) {

}

/* 구글맵 입력칸 (방문지·맛집 공통) */
function mapFieldHTML(pre, val, what) {
  return '<div class="field"><span class="lbl">구글맵 (선택)</span><div class="addrow"><input id="' + pre + '-map" inputmode="url" autocomplete="off" placeholder="구글맵 공유 링크 붙여넣기" value="' + esc(val || '') + '">' +
    '<a class="btn primary" id="' + pre + '-find" target="_blank" rel="noopener" href="#">지도에서 찾기</a></div>' +
    '<p class="hint">‘지도에서 찾기’로 ' + what + '을 검색한 뒤, 구글맵에서 공유 → 링크 복사 → 여기에 붙여 넣으면 이름도 자동으로 채워져요.</p></div>';
}
function wireMapField(sh, pre, t, fallback) {
  const q = id => $('#' + pre + '-' + id, sh);
  const upd = () => { q('find').href = mapURL({ name: q('name').value.trim() || fallback, area: q('area').value.trim() }, t); };
  ['name', 'area'].forEach(k => q(k).addEventListener('input', upd));
  upd();
  q('map').addEventListener('paste', ev => {
    const r = parseMapShare(ev.clipboardData ? ev.clipboardData.getData('text') : '');
    if (!r.url) return;
    ev.preventDefault();
    q('map').value = r.url;
    if (r.name && !q('name').value.trim()) { q('name').value = r.name; upd(); }
  });
  // 붙여넣기 이벤트 없이 글자가 들어온 경우(자동완성 등)도 링크만 골라내요
  q('map').addEventListener('change', () => {
    const r = parseMapShare(q('map').value);
    if (r.url) { q('map').value = r.url; if (r.name && !q('name').value.trim()) { q('name').value = r.name; upd(); } }
  });
  // 저장할 때 쓰는 값: 링크 | '' | null(잘못된 값)
  return () => { const raw = q('map').value.trim(); if (!raw) return ''; return parseMapShare(raw).url || null; };
}

  openSheet('백업 · 복원', body, sh => {
    $('#copyB', sh).onclick = () => {
      const out = $('#bOut', sh);
      const fallback = () => { out.hidden = false; out.value = data; out.focus(); out.select(); $('#bMsg', sh).textContent = ''; toast('아래 글자를 길게 눌러 복사하세요'); };
      try {
        navigator.clipboard.writeText(data).then(() => toast('백업 텍스트를 복사했어요'), fallback);
      } catch (e) { fallback(); }
    };
    $('#restoreB', sh).onclick = () => {
      const msg = $('#bMsg', sh);
      try {
        const o = JSON.parse($('#bIn', sh).value);
        const list = Array.isArray(o) ? o : (o && Array.isArray(o.trips) ? o.trips : null);
        if (!list) throw new Error('x');
        let n = 0;
        list.forEach(t => { if (t && t.id && t.city && t.start && t.end) { S.trips[t.id] = normTrip(t); Store.save(t.id); n++; } });
        if (!n) throw new Error('x');
        closeSheet(); render(); toast(n + '개 여행을 불러왔어요');
      } catch (e) { msg.textContent = '백업 텍스트를 읽지 못했어요. 복사한 글자 전체를 그대로 붙여 넣어 주세요.'; msg.style.color = 'var(--danger)'; }
    };
  });
}

  'rec-area': a => { S.recArea = a.dataset.v; render(); },
  'rec-add-all': a => {
    const t = cur(), th = S.recTheme || 'all', area = a.dataset.v;
    const list = (recsFor(t) || []).filter(r => (th === 'all' || r.theme === th) && r.area === area);
    let n = 0; list.forEach(r => { if (addRec(t, r)) n++; });
    if (n) { commit(t); toast(n + '곳을 담았어요'); }
  },
  'food-tab': a => { S.foodTab = a.dataset.v; render(); },
  'food-edit': (a, id) => foodSheet(cur(), id),
  'food-went': (a, id) => foodSheet(cur(), id, { visited: true }),
  'rate': (a, id) => { const t = cur(), f = t.foods.find(x => x.id === id); if (!f) return; f.rating = +a.dataset.v; commit(t); },
  'close-sheet': closeSheet,
  'photo-target': a => { S.photoTarget = { trip: S.tripId, kind: a.dataset.kind, id: a.dataset.id }; },
  'photo-view': a => openViewer({ kind: a.dataset.kind, id: a.dataset.id }, +(a.dataset.i || 0)),
  'photo-all': a => openViewer(null, +a.dataset.i),
  'viewer-close': closeViewer,
  'viewer-prev': () => { S.viewer.i--; S.viewer.confirm = false; renderViewer(); },
  'viewer-next': () => { S.viewer.i++; S.viewer.confirm = false; renderViewer(); },
  'viewer-del': () => { S.viewer.confirm = true; renderViewer(); },
  'viewer-nodel': () => { S.viewer.confirm = false; renderViewer(); },
  'viewer-del-ok': () => {
    const t = cur(); const list = allPhotos(t, S.viewer.scope); const x = list[S.viewer.i]; if (!x) return;
    const it = itemOf(t, x.kind, x.id); if (!it) return;
    it.photos = (it.photos || []).filter(ph => ph !== x.ph);
    Photos.remove(x.ph); S.viewer.confirm = false;
    commit(t); refreshPhotoGrids(); renderViewer(); toast('사진을 지웠어요');
  },
  'course-new': () => { S.game.course = null; render(); },
  'course-swap': a => { const C = S.game.course; if (!C) return; const i = +a.dataset.i; C.stops[i] = fillSlot(C, i, C.stops[i].key); mountCourse($('#stage'), activeCands(cur()), cur()); },
  'course-save': () => {
    const t = cur(), C = S.game.course; if (!C) return;
    t.courses.push({ id: uid(), ts: Date.now(), date: todayISO(), anchor: C.anchor, stops: C.stops.map(x => ({ label: x.label, kind: x.kind, id: x.id, area: x.area })) });
    if (t.courses.length > 20) t.courses = t.courses.slice(-20);
    commit(t); toast('코스를 저장했어요. 요약 탭에서 볼 수 있어요');
  },
  'course-del': (a, id) => { const t = cur(); t.courses = t.courses.filter(x => x.id !== id); commit(t); toast('코스를 지웠어요'); },
  'game-type': a => { if (S.game.busy) return; S.game.type = a.dataset.v; S.game.result = null; render(); },
  'game-src': a => { if (S.game.busy) return; const k = a.dataset.v; S.game.src[k] = !S.game.src[k]; S.game.result = null; render(); refreshCandSheet(); },
  'menu-set': () => { if (S.game.busy) return; MENU_SET.forEach(m => { if (!S.game.custom.includes(m)) S.game.custom.push(m); S.game.off.delete('c:' + m); }); S.game.result = null; render(); refreshCandSheet(); },
  'cand-toggle': a => {
    if (S.game.busy) return;
    const k = a.dataset.v; if (S.game.off.has(k)) S.game.off.delete(k); else S.game.off.add(k);
    S.game.result = null; render(); refreshCandSheet();
  },
  'cand-remove': a => {
    if (S.game.busy) return;
    const v = a.dataset.v; S.game.custom = S.game.custom.filter(x => x !== v); S.game.off.delete('c:' + v);
    S.game.result = null; render(); refreshCandSheet();
  },
  'spin': spin,
  'sound': () => { Sound.toggle(); render(); if (Sound.on) Sound.tick(); },
  'cand-edit': () => { openSheet('후보 고르기', '<div id="candBox">' + candSheetBody(cur()) + '</div>'); wireCandForm(); },
  'lad-go': a => ladGo(+a.dataset.i),
  'lad-new': () => { if (S.game.busy) return; S.game.ladder = null; S.game.ladSet = null; S.game.result = null; render(); },
  'lad-all': () => { const L = S.game.ladder; if (!L || S.game.busy) return; L.all = true; $$('.lad-res').forEach((el, j) => { el.classList.remove('hide'); el.textContent = L.bottom[j].label; }); },
  'card-pick': a => cardPick(+a.dataset.i),
  'card-shuffle': () => {
    if (S.game.busy) return;
    S.game.cards = null; S.game.cardSet = null; S.game.result = null; $('#gameResult').innerHTML = '';
    const t = cur(); mountCards($('#stage'), activeCands(t), true);
  },
  'res-place': (a, id) => {
    const t = cur(), p = t.places.find(x => x.id === id); if (!p) return;
    p.done = true; p.doneAt = todayISO(); S.game.result = null; S.game.ladder = null; S.game.cards = null;
    commit(t); toast('‘' + p.name + '’ 방문 완료!');
  },
  'res-food': (a, id) => foodSheet(cur(), id, { visited: true, fromGame: true })
};
document.addEventListener('click', ev => {
  const segBtn = ev.target.closest('.sheet [data-seg]');
  if (segBtn) { $$('[data-seg]', segBtn.parentElement).forEach(b => b.setAttribute('aria-pressed', String(b === segBtn))); return; }
  const a = ev.target.closest('[data-act]');
  if (!a) return;
  const fn = ACT[a.dataset.act];
  if (fn) fn(a, a.dataset.id, ev);
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') { if (S.viewer) closeViewer(); else if ($('#sheetRoot').innerHTML) closeSheet(); }
  if (S.viewer && (ev.key === 'ArrowLeft' || ev.key === 'ArrowRight')) { S.viewer.i += ev.key === 'ArrowRight' ? 1 : -1; S.viewer.confirm = false; renderViewer(); }
  // 키보드로 카메라 라벨 열기
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches && ev.target.matches('label[for="photoInput"]')) { ev.preventDefault(); ev.target.click(); }
});
$('#photoInput').addEventListener('change', ev => { const files = Array.from(ev.target.files || []); ev.target.value = ''; onPhotoFiles(files); });
let rzT; window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => { if (S.view === 'trip' && S.tab === 'game' && !S.game.busy) render(); }, 200); });
if (window.matchMedia) {
  const mq = matchMedia('(prefers-color-scheme: dark)');
  const re = () => { if (S.view === 'trip' && S.tab === 'game' && !S.game.busy) render(); };
  if (mq.addEventListener) mq.addEventListener('change', re);
}
// 자정이 지나면 날짜(DAY n)를 새로 계산해요
let lastDay = todayISO();
setInterval(() => { if (todayISO() !== lastDay) { lastDay = todayISO(); render(); } }, 60000);

// 홈 화면 설치 (내 사이트에서 열었을 때만)
let installEvt = null;
const isStandalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
const canInstall = () => !window.claude && /^https?:/.test(location.protocol) && !isStandalone();
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; });
window.addEventListener('appinstalled', () => { installEvt = null; if (S.view === 'home') render(); });

Store.init();
})();
</script>
<!-- /A:BODY -->
<script>
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0 && !window.claude) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
