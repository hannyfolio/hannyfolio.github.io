<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<script>/* /event 처럼 끝에 / 가 없으면 붙여서 다시 열기 (상대 경로 파일을 찾게) */
  if (!/\/$|\.html$/.test(location.pathname)) location.replace(location.pathname + "/" + location.search);</script>
<meta name="theme-color" content="#faf9f7" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" />
<link rel="stylesheet" href="style.css" />
<title>aelleloah</title>
<script src="common.js"></script>
</head>
<body>
<div class="wrap">
  <div class="mark"><b>aelleloah</b><i></i></div>

  <div class="hero">
    <div class="eyebrow">Brand Collaboration</div>
    <h1>당첨자 <strong>링크 만들기</strong></h1>
    <p>브랜드와 진행하는 이벤트 정보를 입력하면<br />당첨자에게 보낼 정보 입력 링크가 만들어져요.</p>
  </div>

  <div class="banner hidden" id="warn">
    구글 시트 연결 전이에요 — 링크는 만들 수 있지만, 당첨자가 입력한 정보는 아직 저장되지 않아요.
  </div>

  <form id="form" novalidate>
    <div class="sec">
      <div class="sec-h"><span>01</span><h2>이벤트 정보</h2></div>
      <div class="field" data-f="brand">
        <label for="brand">브랜드사<span class="req">*</span></label>
        <input type="text" id="brand" placeholder="함께하는 브랜드 이름" maxlength="40" />
        <div class="help">당첨자의 개인정보를 ‘제공받는 자’로 동의 문구에 들어가요.</div>
        <div class="err">브랜드사 이름을 입력해 주세요.</div>
      </div>
      <div class="field" data-f="event">
        <label for="event">이벤트명<span class="req">*</span></label>
        <input type="text" id="event" placeholder="예) 신제품 런칭 기념 이벤트" maxlength="60" />
        <div class="err">이벤트명을 입력해 주세요.</div>
      </div>
      <div class="grid2" style="margin-bottom:20px">
        <div class="field" data-f="count">
          <label for="count">선정 인원<span class="req">*</span></label>
          <input type="number" id="count" placeholder="명" inputmode="numeric" min="1" max="9999" />
          <div class="err">인원을 입력해 주세요.</div>
        </div>
        <div class="field" data-f="until">
          <label for="until">입력 마감일<span class="opt">선택</span></label>
          <input type="date" id="until" />
          <div class="err">오늘 이후 날짜로 골라 주세요.</div>
        </div>
      </div>
      <div class="field" data-f="gift">
        <label for="gift">선물<span class="opt">선택</span></label>
        <input type="text" id="gift" placeholder="예) 시그니처 세럼 50ml" maxlength="80" />
      </div>
      <div class="field" data-f="msg">
        <label for="msg">당첨자에게 전할 말<span class="opt">선택</span></label>
        <textarea id="msg" placeholder="예) 발송은 마감 후 일주일 안에 순차적으로 진행돼요." maxlength="300"></textarea>
      </div>
    </div>
    <button type="submit" class="submit">링크 만들기</button>
  </form>

  <div class="result hidden" id="result">
    <div class="eyebrow" id="r_collab"></div>
    <h3 id="r_title"></h3>
    <div class="meta" id="r_meta"></div>
    <div class="link" id="r_link"></div>
    <div class="btns3">
      <button type="button" class="b-ghost" id="r_open">미리보기</button>
      <button type="button" class="b-ghost" id="r_share">공유</button>
      <button type="button" class="b-main" id="r_copy">링크 복사</button>
    </div>
  </div>

  <div class="sec" style="margin-top:44px">
    <div class="sec-h"><span>02</span><h2>만든 이벤트</h2></div>
    <div class="list" id="list"></div>
  </div>

  <div class="foot">AELLELOAH</div>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  const C = window.EVENT_CONFIG;
  const $ = id => document.getElementById(id);
  const KEY = "aelleloah-events";
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return []; } };
  const save = list => { try { localStorage.setItem(KEY, JSON.stringify(list)); } catch (e) {} };
  const linkOf = ev => new URL("form.html", location.origin + location.pathname).href + "?c=" + EV.encode(ev);
  const metaOf = ev => [ev.n ? ev.n + "명 선정" : "", ev.g, ev.u ? EV.dateLabel(ev.u) + " 마감" : "마감일 없음"].filter(Boolean).join(" · ");

  if (!EV.connected()) $("warn").classList.remove("hidden");

  let toastT;
  function toast(t) {
    $("toast").textContent = t; $("toast").classList.add("show");
    clearTimeout(toastT); toastT = setTimeout(() => $("toast").classList.remove("show"), 1800);
  }
  async function copy(text) {
    try { await navigator.clipboard.writeText(text); toast("링크를 복사했어요"); }
    catch (e) { prompt("아래 링크를 길게 눌러 복사하세요", text); }
  }
  async function share(ev) {
    const url = linkOf(ev);
    if (navigator.share) {
      try { await navigator.share({ title: ev.b + " " + ev.e, text: "[" + ev.b + " × " + C.HOST + "] " + ev.e + " 당첨을 축하드려요! 선물 받으실 정보를 입력해 주세요.", url }); } catch (e) {}
    } else copy(url);
  }

  /* ---------- 만들기 ---------- */
  document.querySelectorAll("#form input, #form textarea").forEach(el =>
    el.addEventListener("input", () => { const f = el.closest(".field"); if (f) f.classList.remove("invalid"); }));

  let current = null;
  $("form").addEventListener("submit", e => {
    e.preventDefault();
    const v = id => $(id).value.trim();
    const bad = [];
    if (!v("brand")) bad.push("brand");
    if (!v("event")) bad.push("event");
    const n = parseInt(v("count"), 10);
    if (!(n >= 1 && n <= 9999)) bad.push("count");
    if (v("until") && EV.isClosed(v("until"))) bad.push("until");
    document.querySelectorAll("#form .field[data-f]").forEach(f => f.classList.toggle("invalid", bad.includes(f.dataset.f)));
    if (bad.length) { $(bad[0]).focus(); return; }

    current = { i: EV.newId(), b: v("brand"), e: v("event"), n, g: v("gift"), u: v("until"), m: v("msg") };
    const list = load(); list.unshift(Object.assign({ created: Date.now() }, current)); save(list);
    showResult(current); renderList();
    $("form").reset();
  });

  function showResult(ev) {
    current = ev;
    $("r_collab").textContent = ev.b + " × " + C.HOST;
    $("r_title").textContent = ev.e;
    $("r_meta").textContent = metaOf(ev);
    $("r_link").textContent = linkOf(ev);
    $("result").classList.remove("hidden");
    $("result").scrollIntoView({ behavior: "smooth", block: "center" });
  }
  $("r_open").onclick = () => window.open(linkOf(current), "_blank");
  $("r_copy").onclick = () => copy(linkOf(current));
  $("r_share").onclick = () => share(current);

  /* ---------- 목록 ---------- */
  function renderList() {
    const list = load(), box = $("list");
    box.innerHTML = "";
    if (!list.length) { box.innerHTML = '<div class="empty">아직 만든 이벤트가 없어요.</div>'; return; }
    list.forEach((ev, idx) => {
      const item = document.createElement("div"); item.className = "item";
      const top = document.createElement("div"); top.className = "item-top";
      const t = document.createElement("b"); t.textContent = ev.e;
      const s = document.createElement("small"); s.textContent = ev.b;
      top.append(t, s);
      const meta = document.createElement("div"); meta.className = "meta";
      meta.textContent = metaOf(ev) + (EV.isClosed(ev.u) ? " (마감됨)" : "");
      const btns = document.createElement("div"); btns.className = "item-btns";
      [["링크 복사", () => copy(linkOf(ev))], ["공유", () => share(ev)], ["미리보기", () => window.open(linkOf(ev), "_blank")],
       ["삭제", () => { if (confirm("목록에서 지울까요?\n(이미 보낸 링크와 시트의 정보는 그대로 남아요)")) { const l = load(); l.splice(idx, 1); save(l); renderList(); } }]]
        .forEach(([label, fn], k) => {
          const b = document.createElement("button"); b.type = "button"; b.textContent = label; b.onclick = fn;
          if (k === 3) b.className = "del";
          btns.append(b);
        });
      item.append(top, meta, btns); box.append(item);
    });
  }
  renderList();
})();
</script>
</body>
</html>
